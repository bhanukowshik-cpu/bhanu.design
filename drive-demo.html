<!DOCTYPE html>
<html lang="en" data-mode="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Drive — Day / Night Demo · Bhanu Kowshik</title>
<!-- Assets: car models — "Cars Bundle" by Quaternius (CC0, via poly.pizza);
     HDRI "Kloofendal Partly Cloudy PureSky" + asphalt/grass textures — Poly Haven (CC0) -->

<meta name="description" content="A real-time driver's-POV demo: one switch, and the whole world — sky, streetlights, headlights, dash — answers.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #EFF3F8;
    --ink-dim: rgba(239,243,248,0.55);
    --accent: #6EA8FF;
    --signal: #58E07A;
    --panel: rgba(16, 20, 27, 0.72);
    --panel-border: rgba(255,255,255,0.10);
    --glow: 0 0 0 rgba(0,0,0,0);
    --font-heading: 'Montserrat', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  [data-mode="night"] {
    --panel: rgba(10, 14, 22, 0.66);
    --panel-border: rgba(120, 160, 255, 0.22);
    --glow: 0 0 26px rgba(110, 168, 255, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0B1829; }
  body { font-family: var(--font-heading); color: var(--ink); }

  #gl { position: fixed; inset: 0; }
  #gl canvas { display: block; }

  /* windshield vignette */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(130% 100% at 50% 42%, transparent 58%, rgba(4,7,12,0.42) 100%);
  }

  /* ─── CABIN — the seat you're in ────────────────────────── */
  .cabin { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    transition: filter 1.2s ease; }
  [data-mode="night"] .cabin { filter: brightness(0.5); }
  .roof {
    position: absolute; top: 0; left: -3%; right: -3%; height: 10vh;
    background: linear-gradient(180deg, #14181F 0%, #10141A 55%, #0B0E13 100%);
    border-radius: 0 0 50% 50% / 0 0 90% 90%;
    box-shadow: 0 6px 30px rgba(0,0,0,0.35);
  }
  .rearview {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: min(220px, 24vw); height: 60px;
    background: linear-gradient(180deg, #0A0D11, #12161D);
    border-radius: 0 0 16px 16px;
    border: 1px solid rgba(255,255,255,0.06); border-top: none;
  }
  .rearview::after {
    content: ''; position: absolute; inset: 7px 9px 9px;
    border-radius: 0 0 11px 11px;
    background: linear-gradient(120deg, #1D242E 0%, #2A3340 45%, #1A212B 100%);
  }
  .pillar {
    position: absolute; top: -6vh; height: 92vh; width: 7vw; max-width: 96px;
    background: linear-gradient(90deg, #171C24, #0C0F14);
  }
  .pillar-l { left: 9vw;  transform: rotate(15deg);  transform-origin: bottom left; }
  .pillar-r { right: 9vw; transform: rotate(-15deg); transform-origin: bottom right; }
  .side-glass {
    position: absolute; top: 7vh; bottom: 26vh; width: 13vw;
    background: linear-gradient(180deg, rgba(8,12,18,0.32), rgba(8,12,18,0.07) 45%, rgba(8,12,18,0.34));
  }
  .glass-l { left: 0; }
  .glass-r { right: 0; }
  .door {
    position: absolute; bottom: 0; width: 15vw; height: 40vh;
    background: linear-gradient(180deg, #161B23, #0B0E13);
  }
  .door-l { left: 0;  clip-path: polygon(0 14%, 100% 42%, 100% 100%, 0 100%); }
  .door-r { right: 0; clip-path: polygon(100% 14%, 0 42%, 0 100%, 100% 100%); }
  .wing {
    position: absolute; bottom: 32vh; width: min(120px, 10vw); height: 7vh;
    background: #10141A; border: 1px solid rgba(255,255,255,0.05);
  }
  .wing-l { left: 0.6vw;  border-radius: 12px 22px 18px 8px; }
  .wing-r { right: 0.6vw; border-radius: 22px 12px 8px 18px; }
  .wing::after {
    content: ''; position: absolute; inset: 6px 8px;
    border-radius: 8px;
    background: linear-gradient(115deg, #232B36, #171E27 70%);
  }
  .hood {
    position: absolute; left: -8%; right: -8%; bottom: 20vh; height: 10vh;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    background: linear-gradient(180deg, #3A444F 0%, #2A323D 46%, #1E252E 100%);
    box-shadow: 0 -3px 18px rgba(0,0,0,0.25), inset 0 2px 2px rgba(255,255,255,0.09);
  }

  /* ─── TOP: MODE SWITCH ──────────────────────────────────── */
  .mode-bar {
    position: fixed; top: clamp(78px, 12vh, 118px); left: 0; right: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    pointer-events: none;
  }
  .mode-row { display: flex; align-items: center; gap: 22px; pointer-events: auto; }
  .mode-lbl {
    font-size: 0.82rem; font-weight: 600; letter-spacing: 0.34em;
    color: var(--ink-dim); transition: color 0.5s ease, text-shadow 0.5s ease;
    user-select: none;
  }
  .mode-lbl.active { color: var(--ink); }
  [data-mode="night"] .mode-lbl.active { text-shadow: 0 0 14px rgba(110,168,255,0.55); }

  /* Bhanu's v5 day-night scene toggle — native 2x, no scaling */
  .mode-toggle {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0; cursor: pointer;
    border-radius: 999px;
    transition: transform 0.15s ease;
  }
  .mode-toggle:active { transform: scale(0.94); }
  .mode-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
  [data-mode="night"] .mode-toggle { filter: drop-shadow(0 0 16px rgba(110,168,255,0.3)); }
  .tt-track {
    position: relative; width: 116px; height: 60px; border-radius: 999px;
    background: linear-gradient(180deg, #9DD8F5 0%, #C2E9FA 100%);
    border: 3px solid rgba(255,255,255,0.40);
    overflow: hidden;
    transition: background 0.5s ease, border-color 0.4s ease;
  }
  .tt-track::after {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 50%;
    border-radius: 999px 999px 50% 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0));
    pointer-events: none; z-index: 10;
  }
  .tt-hill-back  { position: absolute; bottom: 0; left: -5%;  width: 75%; height: 26px; background: #72B87A; border-radius: 50% 60% 0 0; z-index: 1; transition: background 0.5s ease; }
  .tt-hill-front { position: absolute; bottom: 0; right: -8%; width: 62%; height: 22px; background: #5DA066; border-radius: 60% 50% 0 0; z-index: 2; transition: background 0.5s ease; }
  .tt-star { position: absolute; background: rgba(255,255,255,0.9); border-radius: 50%; opacity: 0; transition: opacity 0.4s ease; z-index: 1; }
  .tt-star-1 { width: 5px; height: 5px; top: 10px; left: 16px; }
  .tt-star-2 { width: 4px; height: 4px; top: 22px; left: 36px; }
  .tt-star-3 { width: 4px; height: 4px; top: 12px; left: 54px; }
  .tt-star-4 { width: 3px; height: 3px; top: 26px; left: 22px; }
  [data-mode="night"] .tt-star { opacity: 1; }
  @keyframes tt-twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.12; } }
  [data-mode="night"] .tt-star-1 { animation: tt-twinkle 2.1s ease-in-out infinite; }
  [data-mode="night"] .tt-star-2 { animation: tt-twinkle 1.7s ease-in-out 0.8s infinite; }
  [data-mode="night"] .tt-star-3 { animation: tt-twinkle 2.5s ease-in-out 1.5s infinite; }
  [data-mode="night"] .tt-star-4 { animation: tt-twinkle 1.9s ease-in-out 0.4s infinite; }
  .tt-shoot {
    position: absolute; top: 6px; left: 8px; width: 18px; height: 2px;
    background: linear-gradient(to right, transparent, #FFE87A);
    border-radius: 2px; opacity: 0; transform: rotate(35deg); z-index: 2; pointer-events: none;
  }
  @keyframes tt-shooting-star {
    0%   { opacity: 0; transform: translate(0, 0) rotate(35deg); }
    3%   { opacity: 0.85; }
    15%  { opacity: 0; transform: translate(40px, 16px) rotate(35deg); }
    100% { opacity: 0; transform: translate(40px, 16px) rotate(35deg); }
  }
  [data-mode="night"] .tt-shoot { animation: tt-shooting-star 5s ease-in 2s infinite; }
  .tt-cloud { position: absolute; right: 18px; top: 12px; width: 30px; height: 14px; background: rgba(255,255,255,0.95); border-radius: 20px; opacity: 1; transition: opacity 0.4s ease; z-index: 1; }
  .tt-cloud::before { content: ''; position: absolute; width: 18px; height: 18px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -10px; left: 4px; }
  .tt-cloud::after  { content: ''; position: absolute; width: 14px; height: 14px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -8px; left: 14px; }
  [data-mode="night"] .tt-cloud { opacity: 0; }
  @keyframes tt-cloud-drift { from { transform: translateX(60px); } to { transform: translateX(-170px); } }
  [data-mode="day"] .tt-cloud { animation: tt-cloud-drift 26s linear 0s infinite backwards; }
  .tt-cloud-b { position: absolute; right: 6px; top: 22px; width: 18px; height: 8px; background: rgba(255,255,255,0.95); border-radius: 16px; opacity: 0; transition: opacity 0.4s ease; z-index: 1; pointer-events: none; }
  .tt-cloud-b::before { content: ''; position: absolute; width: 12px; height: 12px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -6px; left: 2px; }
  .tt-cloud-b::after  { content: ''; position: absolute; width: 10px; height: 10px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -6px; left: 8px; }
  [data-mode="night"] .tt-cloud-b { opacity: 0; }
  [data-mode="day"]  .tt-cloud-b { opacity: 0.65; animation: tt-cloud-drift 18s linear 4s infinite backwards; }
  .tt-cloud-c { position: absolute; right: 36px; top: 8px; width: 22px; height: 10px; background: rgba(255,255,255,0.95); border-radius: 16px; opacity: 0; transition: opacity 0.4s ease; z-index: 1; pointer-events: none; }
  .tt-cloud-c::before { content: ''; position: absolute; width: 14px; height: 14px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -8px; left: 2px; }
  .tt-cloud-c::after  { content: ''; position: absolute; width: 12px; height: 12px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -6px; left: 10px; }
  [data-mode="night"] .tt-cloud-c { opacity: 0; }
  [data-mode="day"]  .tt-cloud-c { opacity: 0.45; animation: tt-cloud-drift 34s linear 7.5s infinite backwards; }
  .tt-thumb {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    top: 50%; left: 3px; overflow: hidden;
    background: radial-gradient(circle at 40% 38%, #FFE97A, #F9A800);
    transform: translateX(0) translateY(-50%);
    transition: transform 0.44s cubic-bezier(0.34,1.56,0.64,1), background 0.5s ease;
    z-index: 3;
  }
  .tt-thumb::before, .tt-thumb::after {
    content: ''; position: absolute; border-radius: 50%;
    background: rgba(148,158,185,0.50); opacity: 0; transition: opacity 0.4s ease;
  }
  .tt-thumb::before { width: 14px; height: 14px; top: 8px;  left: 10px; }
  .tt-thumb::after  { width: 10px; height: 10px; top: 26px; left: 28px; }
  [data-mode="night"] .tt-thumb::before, [data-mode="night"] .tt-thumb::after { opacity: 1; }
  [data-mode="day"] .tt-track { background: linear-gradient(180deg, #9DD8F5 0%, #C2E9FA 100%); border-color: rgba(255,255,255,0.40); }
  [data-mode="day"] .tt-hill-back  { background: #72B87A; }
  [data-mode="day"] .tt-hill-front { background: #5DA066; }
  [data-mode="day"] .tt-thumb { transform: translateX(0) translateY(-50%); background: radial-gradient(circle at 40% 38%, #FFE97A, #F9A800); }
  [data-mode="day"] .tt-star  { opacity: 0; }
  [data-mode="day"] .tt-cloud { opacity: 1; }
  [data-mode="day"] .tt-thumb::before, [data-mode="day"] .tt-thumb::after { opacity: 0; }
  [data-mode="night"] .tt-track { background: linear-gradient(180deg, #0B1829 0%, #152238 100%); border-color: rgba(255,255,255,0.10); }
  [data-mode="night"] .tt-track::after { background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0)); }
  [data-mode="night"] .tt-hill-back  { background: #1D3D25; }
  [data-mode="night"] .tt-hill-front { background: #152C1A; }
  [data-mode="night"] .tt-thumb { transform: translateX(56px) translateY(-50%); background: #EEF0F5; }

  .mode-tag {
    font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.42em;
    color: var(--ink-dim); transition: color 0.5s ease;
  }
  [data-mode="night"] .mode-tag { color: rgba(150, 182, 255, 0.75); }
  .mode-hint {
    font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.28em;
    color: rgba(239,243,248,0.32);
  }

  /* ─── COCKPIT ───────────────────────────────────────────── */
  .cockpit {
    position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; min-height: 210px;
    z-index: 2; pointer-events: none;
  }
  .dash-body {
    position: absolute; left: -12%; right: -12%; bottom: -46%; height: 130%;
    border-radius: 50% 50% 0 0 / 62% 62% 0 0;
    background: linear-gradient(180deg, #1A2028 0%, #12161D 34%, #0B0E13 100%);
    box-shadow: 0 -8px 44px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.05);
  }
  .wheel {
    position: absolute; left: 11%; bottom: -290px; width: 480px; height: 480px;
    border-radius: 50%; border: 30px solid #191E26;
    box-shadow: inset 0 4px 10px rgba(255,255,255,0.05), 0 -6px 30px rgba(0,0,0,0.45);
    z-index: 1;
  }
  .wheel::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 150px; height: 150px;
    transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle at 42% 36%, #232A34, #12161D);
  }

  /* cluster — set into the dash, seen through the wheel */
  .cluster {
    position: absolute; left: calc(11% + 240px); bottom: 5vh; transform: translateX(-50%);
    z-index: 0;
    width: 230px; padding: 16px 20px 14px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: var(--glow);
    text-align: center;
    transition: border-color 0.6s ease, box-shadow 0.6s ease, background 0.6s ease;
  }
  .signals { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .sig { width: 22px; height: 18px; opacity: 0.07; transition: opacity 0.15s ease; }
  .sig svg { display: block; width: 100%; height: 100%; fill: var(--signal); }
  .sig.blink { animation: sig-blink 0.46s step-end infinite; }
  @keyframes sig-blink { 0% { opacity: 1; } 50% { opacity: 0.14; } }
  .speed-num {
    font-family: var(--font-mono); font-weight: 700;
    font-size: 58px; line-height: 1.02; letter-spacing: -0.02em;
  }
  .speed-unit {
    font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.4em;
    color: var(--ink-dim); margin-top: 2px;
  }
  .range-row {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.09);
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-dim);
    display: flex; justify-content: center; gap: 6px;
  }
  .gear { color: var(--ink); font-weight: 700; }

  /* center HUD */
  .hud {
    position: absolute; left: auto; right: clamp(20px, 4vw, 64px); bottom: clamp(26px, 6.5vh, 64px);
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 26px; align-items: center;
    width: min(520px, 46vw); padding: 20px 26px;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: var(--glow);
    transition: border-color 0.6s ease, box-shadow 0.6s ease, background 0.6s ease;
  }
  .hud-label {
    font-size: 0.6rem; font-weight: 600; letter-spacing: 0.3em;
    color: var(--ink-dim); margin-bottom: 9px;
  }
  .hud-turn .turn-ic { width: 30px; height: 30px; margin-bottom: 7px; }
  .hud-turn .turn-ic svg { display: block; width: 100%; height: 100%; stroke: var(--ink); }
  .turn-dist { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 700; }
  .turn-road { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-dim); margin-top: 3px; }
  .hud-map canvas { display: block; border-radius: 12px; }
  .hud-eta { text-align: right; }
  .eta-time { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 700; }
  .eta-sub  { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-dim); margin-top: 4px; }
  .eta-bar {
    margin-top: 10px; margin-left: auto; width: 92px; height: 3px; border-radius: 3px;
    background: rgba(255,255,255,0.14); overflow: hidden;
  }
  .eta-fill { width: 34%; height: 100%; border-radius: 3px; background: var(--accent);
    transition: width 1s linear; box-shadow: 0 0 8px rgba(110,168,255,0.7); }

  /* boot choreography — panels power up when night engages */
  .booting .cluster, .booting .hud { animation: panel-boot 1.15s ease-out; }
  .booting .speed-num { animation: seg-flicker 0.9s step-end; }
  .booting .eta-time, .booting .turn-dist { animation: seg-flicker 1.05s step-end; }
  @keyframes panel-boot {
    0%   { opacity: 0.12; box-shadow: none; }
    18%  { opacity: 0.65; }
    26%  { opacity: 0.2; }
    38%  { opacity: 0.85; }
    52%  { opacity: 0.6; }
    100% { opacity: 1; }
  }
  @keyframes seg-flicker {
    0% { opacity: 0; } 14% { opacity: 1; } 22% { opacity: 0.2; }
    34% { opacity: 1; } 46% { opacity: 0.45; } 58% { opacity: 1; } 100% { opacity: 1; }
  }

  @media (max-width: 900px) {
    .wheel { left: -6%; width: 380px; height: 380px; bottom: -240px; }
    .cluster { left: calc(-6% + 190px); width: 190px; padding: 12px 16px 10px; bottom: 4vh; }
    .speed-num { font-size: 44px; }
    .hud { width: min(480px, 92vw); gap: 16px; padding: 16px 18px;
           left: auto; right: 12px; transform: none; }
    .rearview { display: none; }
    .mode-bar { top: clamp(20px, 5vh, 50px); }
  }
  @media (max-width: 640px) {
    .hud { grid-template-columns: auto 1fr; left: 12px; right: 12px; width: auto; transform: none; padding: 14px 16px; }
    .hud-turn { display: none; }
    .cluster { left: 12px; bottom: 212px; width: 150px; padding: 10px 14px; transform: none; z-index: 2; }
    .speed-num { font-size: 34px; }
    .signals { margin-bottom: 2px; }
    .range-row { margin-top: 6px; padding-top: 6px; }
    .mode-hint { display: none; }
    .pillar, .wing { display: none; }
    .side-glass { width: 7vw; }
    .door { width: 8vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tt-thumb { transition: transform 0.15s ease, background 0.15s ease; }
    [data-mode="night"] .tt-star-1, [data-mode="night"] .tt-star-2,
    [data-mode="night"] .tt-star-3, [data-mode="night"] .tt-star-4,
    [data-mode="night"] .tt-shoot,
    [data-mode="day"] .tt-cloud, [data-mode="day"] .tt-cloud-b,
    [data-mode="day"] .tt-cloud-c { animation: none; }
    .booting .cluster, .booting .hud, .booting .speed-num,
    .booting .eta-time, .booting .turn-dist { animation: none; }
  }
</style>
</head>
<body>

<div id="gl"></div>
<div class="vignette"></div>

<div class="mode-bar">
  <div class="mode-row">
    <span class="mode-lbl lbl-day active" id="lblDay">DAY</span>
    <button class="mode-toggle" id="modeToggle" aria-label="Toggle night mode">
      <span class="tt-track">
        <span class="tt-star tt-star-1"></span>
        <span class="tt-star tt-star-2"></span>
        <span class="tt-star tt-star-3"></span>
        <span class="tt-star tt-star-4"></span>
        <span class="tt-shoot"></span>
        <span class="tt-cloud"></span>
        <span class="tt-cloud-b"></span>
        <span class="tt-cloud-c"></span>
        <span class="tt-hill-back"></span>
        <span class="tt-hill-front"></span>
        <span class="tt-thumb"></span>
      </span>
    </button>
    <span class="mode-lbl lbl-night" id="lblNight">NIGHT</span>
  </div>
  <div class="mode-tag">ADAPTIVE VIEW. MAXIMUM FOCUS.</div>
  <div class="mode-hint">AUTOPILOT ENGAGED</div>
</div>

<div class="cabin" aria-hidden="true">
  <div class="roof"></div>
  <div class="rearview"></div>
  <div class="side-glass glass-l"></div>
  <div class="side-glass glass-r"></div>
  <div class="pillar pillar-l"></div>
  <div class="pillar pillar-r"></div>
  <div class="hood"></div>
  <div class="door door-l"></div>
  <div class="door door-r"></div>
  <div class="wing wing-l"></div>
  <div class="wing wing-r"></div>
</div>

<div class="cockpit" id="cockpit">
  <div class="dash-body"></div>
  <div class="wheel"></div>

  <div class="cluster">
    <div class="signals">

function radialTexture(size = 128, edge = 1.8) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (x + 0.5) / size - 0.5, dy = (y + 0.5) / size - 0.5;
    const d = Math.min(1, Math.hypot(dx, dy) * 2);
    const idx = (y * size + x) * 4;
    img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = 255;
    img.data[idx + 3] = Math.round(Math.pow(1 - d, edge) * 255);
  }
  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
}

function cloudTexture(seed) {
  const w = 512, h = 256;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  let s = seed;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const blobs = [];
  const n = 5 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) blobs.push({ x: 0.2 + rnd() * 0.6, y: 0.4 + rnd() * 0.28, r: 0.1 + rnd() * 0.15 });
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const u = x / w, v = y / h;
    let f = 0;
    for (const b of blobs) {
      const dx = (u - b.x) / (b.r * 1.7), dy = (v - b.y) / b.r;
      f += Math.max(0, 1 - (dx * dx + dy * dy));
    }
    let a = Math.min(1, f * 0.85);
    a = a * a * (3 - 2 * a);
    if (v > 0.7) a *= Math.max(0, 1 - (v - 0.7) / 0.14);
    const idx = (y * w + x) * 4;
    img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = 255;
    img.data[idx + 3] = Math.round(a * 235);
  }
  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
}

  const canopy = new THREE.Mesh(new RoundedBoxGeometry(1.56, 0.6, 2.5, 4, 0.3), canopyMat);
  canopy.position.set(0, 0.98, 0.16);
  canopy.scale.y = 0.8;
  const tlMat = new THREE.MeshBasicMaterial({ color: 0x40100E, toneMapped: false });
  const bar = new THREE.Mesh(new RoundedBoxGeometry(1.58, 0.1, 0.08, 2, 0.04), tlMat);
  bar.position.set(0, 0.76, 2.26);
  const proc = [body, canopy];
  [[-0.82, -1.42], [0.82, -1.42], [-0.82, 1.42], [0.82, 1.42]].forEach(([x, z]) => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, 0.34, z);
    proc.push(w);
    g.add(w);
  });
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(2.9, 5.6),
    new THREE.MeshBasicMaterial({ map: shadowTex, color: 0x000000, transparent: true, opacity: 0.32, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  g.userData.tlMat = tlMat;
  g.userData.bar = bar;
  g.userData.proc = proc;
  g.add(body, canopy, bar, shadow);
  return g;
}

/* real CC0 car models (Quaternius Cars Bundle via poly.pizza) replace the placeholder bodies */
const CAR_URLS = [
  'assets/cars/34db1344-31cc-49ac-bc46-c055f68e39ca.glb',
  'assets/cars/59a67a6c-490e-472e-bae6-5a4d2541f1c7.glb',
  'assets/cars/e6410e19-a88f-4158-bc91-c19fccf85028.glb',
  'assets/cars/d35173c8-6078-4367-8f87-b1f2599f0bb7.glb',
  'assets/cars/e5fbf2ee-5c9e-47d5-8ab6-80cacd463baa.glb',
];
const gltfLoader = new GLTFLoader();
const CAR_FLIP = Math.PI; /* Quaternius cars face +Z; ours drive toward -Z */
function fitCarModel(carGroup, url) {
  gltfLoader.load(url, (res) => {
    const model = res.scene;
    let box = new THREE.Box3().setFromObject(model);
    let size = box.getSize(new THREE.Vector3());
    if (size.x > size.z) model.rotation.y = Math.PI / 2;
    model.rotation.y += CAR_FLIP;
    box = new THREE.Box3().setFromObject(model);
    size = box.getSize(new THREE.Vector3());
    const s = 4.4 / size.z;
    model.scale.setScalar(s);
    box = new THREE.Box3().setFromObject(model);
    const ctr = box.getCenter(new THREE.Vector3());
    model.position.x -= ctr.x;
    model.position.z -= ctr.z;
    model.position.y -= box.min.y;
    carGroup.userData.proc.forEach((m) => { m.visible = false; });
    const bar = carGroup.userData.bar;
    bar.position.set(0, size.y * s * 0.42, (size.z * s) / 2 - 0.05);
    bar.scale.set((size.x * s) / 1.86 * 0.8, 0.85, 0.85);
    carGroup.add(model);
    refreshEnvMats();
  });
}
/* dv = our speed minus theirs: positive → we gain on them and pass; negative → they overtake us */
const cars = [];
[
  { lane: 0,  z: -46,  dv:  2.6 },
  { lane: 1,  z: -120, dv:  3.6 },
  { lane: -1, z: -200, dv:  4.2 },
  { lane: 1,  z: -265, dv:  3.0 },
  { lane: -1, z: 18,   dv: -4.6 },
].forEach((d, i) => {
  const car = makeCar(carPalette[i % carPalette.length]);
  car.position.set(d.lane * LANE_W, 0, d.z);
  car.userData.lane = d.lane;
  car.userData.dv = d.dv;
  cars.push(car); world.add(car);
  fitCarModel(car, CAR_URLS[i % CAR_URLS.length]);
});
function laneFree(l, zMin, zMax, self) {
  return !cars.some((c) => c !== self && c.userData.lane === l && c.position.z > zMin && c.position.z < zMax);
}

/* headlight beam pool on the road */
const beam = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 21), glowQuadMat(0xFFE9C0));
beam.rotation.x = -Math.PI / 2;
beam.position.set(0, 0.04, -16);
scene.add(beam);

/* ══════════════════════════ STATE ══════════════════════════ */
const state = {
  mode: 'day',            // committed mode
  p: 0,                   // phase 0=day … 1=night
  pTarget: 0,
  tSwitch: -99,           // clock time of last toggle
  lampsArmed: false,      // sequence trigger latch
  headlightOn: false,
  lane: 0,                // -1 | 0 | 1
  laneX: 0, laneAnim: null,
  speed: 66, speedTarget: 66,
  dipUntil: 0,
  signal: 0,              // -1 left, 1 right, 0 none
  pendingLane: null,
  laneCommitAt: 0,
  tLaneStart: 0,
  changing: false,
  range: 432,
  eta: 34,
};
const clock = new THREE.Clock();
const TRANS = REDUCED ? 0.9 : 4.6;

/* ══════════════════════════ DOM ════════════════════════════ */
const el = {
  html: document.documentElement,
  cockpit: document.getElementById('cockpit'),
  toggle: document.getElementById('modeToggle'),
  lblDay: document.getElementById('lblDay'),
  lblNight: document.getElementById('lblNight'),
  speed: document.getElementById('speedNum'),
  range: document.getElementById('rangeNum'),
  sigL: document.getElementById('sigL'),
  sigR: document.getElementById('sigR'),
  etaFill: document.getElementById('etaFill'),
};

function setMode(mode) {
  if (mode === state.mode) return;
  state.mode = mode;
  state.pTarget = mode === 'night' ? 1 : 0;
  state.tSwitch = simT;
  state.lampsArmed = false;
  el.html.setAttribute('data-mode', mode);
  el.lblDay.classList.toggle('active', mode === 'day');
  el.lblNight.classList.toggle('active', mode === 'night');
}
el.toggle.addEventListener('click', () => setMode(state.mode === 'day' ? 'night' : 'day'));

function requestLane(dirn) {
  if (state.changing) return;
  const target = state.lane + dirn;
  if (target < -1 || target > 1) return;
  state.changing = true;
  state.signal = dirn;
  (dirn < 0 ? el.sigL : el.sigR).classList.add('blink');
  state.speedTarget -= 7;
  state.dipUntil = simT + 1.15;
  state.pendingLane = target;
  state.laneCommitAt = simT + (REDUCED ? 0.06 : 0.48);
  state.tLaneStart = simT;
}
/* no manual lane control — the autopilot drives; T still flips the theme */
addEventListener('keydown', (e) => {
  if (e.key === 't' || e.key === 'T') setMode(state.mode === 'day' ? 'night' : 'day');
});

function bootDash() {
  el.cockpit.classList.remove('booting');
  void el.cockpit.offsetHeight;
  el.cockpit.classList.add('booting');
  setTimeout(() => el.cockpit.classList.remove('booting'), 1300);
}

/* mini map */
const mapC = document.getElementById('mapCanvas');
const MAP_W = 118, MAP_H = 138, MDPR = Math.min(devicePixelRatio || 1, 2);
mapC.width = MAP_W * MDPR; mapC.height = MAP_H * MDPR;
mapC.style.width = MAP_W + 'px'; mapC.style.height = MAP_H + 'px';
const mg = mapC.getContext('2d');
let mapScroll = 0;
function drawMap(dt) {
  mapScroll = (mapScroll + state.speed * dt * 2.1) % 26;
  mg.setTransform(MDPR, 0, 0, MDPR, 0, 0);
  mg.clearRect(0, 0, MAP_W, MAP_H);
  mg.fillStyle = 'rgba(255,255,255,0.045)';
  mg.fillRect(0, 0, MAP_W, MAP_H);
  const cx = MAP_W / 2, laneW = 24;
  /* lane lines */
  mg.strokeStyle = 'rgba(255,255,255,0.22)';
  mg.lineWidth = 1.4;
  mg.setLineDash([9, 8]);
  [cx - laneW / 2 - laneW, cx - laneW / 2, cx + laneW / 2, cx + laneW / 2 + laneW].forEach((x, i) => {
    if (i === 0 || i === 3) mg.setLineDash([]);
    else mg.setLineDash([9, 8]);
    mg.lineDashOffset = -mapScroll;
    mg.beginPath(); mg.moveTo(x, -10); mg.lineTo(x, MAP_H + 10); mg.stroke();
  });
  mg.setLineDash([]);
  /* route glow in current lane */
  const carX = cx + (state.laneX / LANE_W) * laneW;
  const grad = mg.createLinearGradient(0, 0, 0, MAP_H);
  grad.addColorStop(0, 'rgba(110,168,255,0)');
  grad.addColorStop(0.25, 'rgba(110,168,255,0.75)');
  grad.addColorStop(1, 'rgba(110,168,255,0.95)');
  mg.strokeStyle = grad;
  mg.lineWidth = 6;
  mg.lineCap = 'round';
  mg.beginPath(); mg.moveTo(carX, MAP_H - 22); mg.lineTo(carX, 8); mg.stroke();
  /* pulsing chevrons */
  const pulse = (simT * 1.6) % 1;
  for (let i = 0; i < 3; i++) {
    const yy = MAP_H - 48 - i * 26 - pulse * 12;
    const op = 0.25 + 0.55 * (1 - Math.abs(i - 1 - pulse) / 2);
    mg.strokeStyle = `rgba(220,235,255,${op.toFixed(2)})`;
    mg.lineWidth = 2.6;
    mg.beginPath();
    mg.moveTo(carX - 7, yy + 6); mg.lineTo(carX, yy); mg.lineTo(carX + 7, yy + 6);
    mg.stroke();
  }
  /* car marker */
  mg.fillStyle = '#EFF3F8';
  mg.beginPath();
  mg.moveTo(carX, MAP_H - 30);
  mg.lineTo(carX - 6, MAP_H - 17);
  mg.lineTo(carX + 6, MAP_H - 17);
  mg.closePath(); mg.fill();
}

/* lamp flicker curve: 0..1 progress → intensity with 2-3 stutters, then hold */
function flickerCurve(t, seed) {
  if (t <= 0) return 0;
  if (t > 0.55 || REDUCED) return 1;
  const k = t / 0.55;
  const gate = Math.sin(k * (16 + seed)) > (0.75 - k) ? 1 : 0.08;
  return gate * (0.35 + 0.65 * k);
}

/* ══════════════════════════ FRAME ══════════════════════════ */
const tmpA = new THREE.Color(), tmpB = new THREE.Color();
let acc = 0;
let simT = 0; /* simulation clock — decoupled from wall time so hidden-tab throttling can't stall the world */

function frame(dtOv) {
  const dt = dtOv !== undefined ? dtOv : Math.min(clock.getDelta(), 0.05);
  simT += dt;
  const t = simT;

  /* phase */
  const dur = TRANS;
  const k = dt / dur * 1.0;
  state.p += Math.sign(state.pTarget - state.p) * Math.min(Math.abs(state.pTarget - state.p), k);
  const p = smooth(0, 1, state.p);

  /* driving sim */
  const wander = Math.sin(t * 0.23) * 1.7 + Math.sin(t * 0.61) * 0.9;
  if (t > state.dipUntil && state.speedTarget < 60) state.speedTarget = 66;
  const targetNow = (state.dipUntil > t ? state.speedTarget : 66) + wander;
  state.speed += (targetNow - state.speed) * Math.min(1, dt * 1.8);
  const mps = state.speed * 0.48;

  /* lane maneuver — commit and settle on sim time */
  if (state.pendingLane != null && t >= state.laneCommitAt) {
    state.lane = state.pendingLane;
    state.pendingLane = null;
    state.laneAnim = { from: state.laneX, to: state.lane * LANE_W, t0: t, dur: REDUCED ? 0.2 : 1.7 };
  }
  if (state.changing && state.pendingLane == null && !state.laneAnim && t - state.tLaneStart > 1.4) {
    el.sigL.classList.remove('blink');
    el.sigR.classList.remove('blink');
    state.signal = 0;
    state.changing = false;
  }

  /* eased S-curve merge — deliberate, no overshoot, no wobble */
  let laneVel = 0;
  if (state.laneAnim) {
    const a = state.laneAnim;
    const k = Math.min(1, (t - a.t0) / a.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const prevX = state.laneX;
    state.laneX = a.from + (a.to - a.from) * e;
    laneVel = (state.laneX - prevX) / Math.max(dt, 1e-4);
    if (k >= 1) { state.laneX = a.to; state.laneAnim = null; }
  }

  /* camera */
  camera.position.x = state.laneX;
  camera.position.y = CAM_Y + (REDUCED ? 0 : Math.sin(t * 9.3) * 0.011 + Math.sin(t * 3.1) * 0.008);
  camera.rotation.z = -laneVel * 0.02;
  camera.rotation.y = -laneVel * 0.011;
  camera.rotation.x = -0.045;
  headlight.position.x = state.laneX;
  headlight.target.position.x = state.laneX;
  beam.position.x = state.laneX;

  /* world scroll + recycling */
  roadTex.offset.y -= (mps * dt) / (1600 / 26) * 1.0;
  for (const h of hills) {
    if (h.userData.horizon) continue;
    h.position.z += mps * dt;
    if (h.position.z > 60) h.position.z -= 16 * 85;
  }
  for (const pMesh of posts) {
    pMesh.position.z += mps * dt;
    if (pMesh.position.z > 8) pMesh.position.z -= 45 * 13;
  }
  for (const tr of trees) {
    tr.position.z += mps * dt;
    if (tr.position.z > 30) tr.position.z -= 1330;
  }
  for (const L of LAMPS) {
    L.position.z += mps * dt;
    if (L.position.z > 24) L.position.z -= LAMPS.length * LAMP_SPACING;
  }
  for (const c of clouds) {
    c.position.x += dt * 1.2;
    if (c.position.x > 320) c.position.x = -320;
  }
  cars.forEach((c, i) => {
    const u = c.userData;
    c.position.z += u.dv * dt;
    if (u.dv > 0 && c.position.z > 12) {           /* passed us — respawn far ahead */
      c.position.z = -260 - Math.random() * 60;
      const opts = [-1, 0, 1].filter((l) => laneFree(l, c.position.z - 45, c.position.z + 45, c));
      if (opts.length) u.lane = opts[Math.floor(Math.random() * opts.length)];
    } else if (u.dv < 0 && c.position.z < -280) {  /* overtaker done — return behind us */
      c.position.z = 16 + Math.random() * 10;
      const opts = [-1, 0, 1].filter((l) => l !== state.lane && laneFree(l, -30, 30, c));
      if (opts.length) u.lane = opts[Math.floor(Math.random() * opts.length)];
    }
    c.position.x = u.lane * LANE_W + Math.sin(t * 0.9 + i * 2.1) * 0.07;
  });

  /* autopilot — when traffic ahead slows us, signal and take a free lane */
  if (!state.changing && t > 6 && t - (state.lastChange || 0) > 7) {
    const blocked = cars.some((c) => c.userData.lane === state.lane && c.position.z > -48 && c.position.z < -10);
    if (blocked) {
      const free = [state.lane - 1, state.lane + 1]
        .filter((l) => l >= -1 && l <= 1)
        .filter((l) => laneFree(l, -70, 16, null));
      if (free.length) {
        state.lastChange = t;
        requestLane(free[Math.floor(Math.random() * free.length)] - state.lane);
      }
    }
  }

  /* palettes */
  skyMat.uniforms.topColor.value = ramp(PAL.skyTop, p, tmpA).clone();
  skyMat.uniforms.bottomColor.value = ramp(PAL.skyBot, p, tmpA).clone();
  ramp(PAL.fog, p, scene.fog.color);
  ramp(PAL.grass, p, ground.material.color);
  ramp(PAL.road, p, road.material.color);
  ramp(PAL.hemiSky, p, hemi.color);
  ramp(PAL.hemiGnd, p, hemi.groundColor);
  ramp(PAL.sunLight, p, dir.color);
  hemi.intensity = lerp(1.15, 0.34, p);
  dir.intensity = lerp(2.0, 0.22, p);
  if (envMats.size) {
    const ei = lerp(1.15, 0.12, p);
    envMats.forEach((m) => { m.envMapIntensity = ei; });
  }
  ramp(PAL.hillA, p, tmpA); ramp(PAL.hillB, p, tmpB);
  for (const h of hills) {
    if (h.userData.mountain) { ramp(PAL.mountain, p, h.material.color); continue; }
    h.material.color.copy(tmpA).lerp(tmpB, h.userData.mix);
  }
  folMatA.color.copy(tmpA).multiplyScalar(0.92);
  folMatB.color.copy(tmpB).multiplyScalar(0.9);

  /* celestial */
  const sunY = lerp(250, -95, smooth(0, 0.62, p));
  sunGroup.position.y = sunY;
  const sunFade = 1 - smooth(0.5, 0.66, p);
  sun.material.opacity = sunFade;
  sunGlow.material.opacity = 0.5 * sunFade;
  const moonY = lerp(-95, 245, smooth(0.4, 0.96, p));
  moonGroup.position.y = moonY;
  const moonShow = smooth(0.45, 0.8, p);
  moon.material.opacity = moonShow;
  moonMask.material.opacity = moonShow;
  moonMask.material.color.copy(skyMat.uniforms.topColor.value).lerp(skyMat.uniforms.bottomColor.value, 0.3);
  moonGlow.material.opacity = 0.3 * moonShow;
  starMat.opacity = smooth(0.58, 0.96, p) * 0.8;
  shooters.forEach((sh) => {
    if (!REDUCED && p > 0.85 && t > sh.next) {
      sh.t0 = t; sh.next = t + 4.5 + Math.random() * 6;
      sh.x0 = -280 + Math.random() * 560; sh.y0 = 150 + Math.random() * 110;
    }
    const life = t - sh.t0;
    if (life >= 0 && life <= 1 && p > 0.6) {
      sh.mesh.position.set(sh.x0 + life * 130, sh.y0 - life * 46, -640);
      sh.mesh.material.opacity = Math.sin(life * Math.PI) * 0.9;
    } else sh.mesh.material.opacity = 0;
  });
  const cloudOp = 1 - smooth(0.32, 0.72, p);
  clouds.forEach((c) => { c.material.opacity = 0.8 * cloudOp; });

  /* exposure dip mid-transition — the eye adjusting */
  const dipT = Math.abs(p - 0.5);
  renderer.toneMappingExposure = 1.05 - (1 - smooth(0.18, 0.5, dipT)) * 0.16;
  bloom.strength = lerp(0.22, 0.85, p);

  /* streetlights: staggered wake with flicker */
  const goingNight = state.pTarget === 1;
  if (goingNight && p > 0.6 && !state.lampsArmed) {
    state.lampsArmed = true;
    state.tLamps = t;
  }
  if (!goingNight) state.lampsArmed = false;
  LAMPS.forEach((L, i) => {
    let on = 0;
    if (goingNight && state.lampsArmed) {
      const local = (t - state.tLamps) - i * (REDUCED ? 0 : 0.11);
      on = flickerCurve(local / 1.0, L.userData.seed);
    } else if (!goingNight) {
      on = Math.max(0, L.userData.on - dt * 2.5); /* quick fade at dawn */
    }
    L.userData.on = goingNight ? Math.max(on, L.userData.on * 0 + on) : on;
    const v = L.userData.on;
    L.userData.headMat.color.setRGB(0.14 + v * 1.1, 0.14 + v * 0.92, 0.16 + v * 0.55);
    L.userData.glow.opacity = v * 0.62;
    L.userData.pool.uniforms.uOp.value = v * 0.6;
  });

  /* taillights */
  const tail = smooth(0.7, 0.82, p);
  cars.forEach((c, i) => {
    const vv = smooth(0.7 + i * 0.035, 0.82 + i * 0.035, p);
    c.userData.tlMat.color.setRGB(0.25 + vv * 0.75, 0.06 + vv * 0.1, 0.05 + vv * 0.08);
  });

  /* headlights + dash boot */
  const wantHead = goingNight && p > 0.82;
  if (wantHead && !state.headlightOn) {
    state.headlightOn = true;
    bootDash();
  }
  if (!goingNight && p < 0.5) state.headlightOn = false;
  const headGoal = state.headlightOn ? 1 : 0;
  headlight.intensity += (headGoal * 60 - headlight.intensity) * Math.min(1, dt * 6);
  const bu = beam.material.uniforms.uOp;
  bu.value += (headGoal * 0.34 - bu.value) * Math.min(1, dt * 6);

  /* DOM readouts (10 Hz) */
  acc += dt;
  if (acc > 0.1) {
    acc = 0;
    el.speed.textContent = Math.round(state.speed);
    state.range -= state.speed / 36000; /* real miles per 0.1s tick */
    el.range.textContent = Math.max(0, state.range).toFixed(0) + ' mi';
    el.etaFill.style.width = (34 + (t % 120) / 120 * 8).toFixed(1) + '%';
  }
  drawMap(dt);

  composer.render();
}

if (RAFSHIM) {
  window.__drive = {
    state, setMode, requestLane,
    step: (n = 1) => { for (let i = 0; i < n; i++) frame(1 / 60); },
  };
  setInterval(() => frame(1 / 60), 16);
} else {
  renderer.setAnimationLoop(() => frame());
}
</script>
</body>
</html>
