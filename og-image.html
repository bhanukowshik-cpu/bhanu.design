<!DOCTYPE html>
<!-- Source for images/og-image.png (social share card) — section-1 theme:
     B&W polaroid portrait centered, orbited by hero-verb-styled tags.
     Re-render after edits:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
       --screenshot=og-2x.png --window-size=1200,630 --force-device-scale-factor=2 \
       --virtual-time-budget=10000 --hide-scrollbars "file://$PWD/og-image.html"
     sips -z 630 1200 og-2x.png --out images/og-image.png -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: #0d0d0d;               /* hero card surface */
      font-family: 'Bricolage Grotesque', sans-serif;
    }
    /* faint dot mesh, like the page canvas behind the card */
    .dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.10) 1.3px, transparent 1.4px);
      background-size: 26px 26px; background-position: center;
      -webkit-mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, #000 40%, transparent 100%);
              mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, #000 40%, transparent 100%);
      opacity: .55;
    }
    /* lime glow rising from the bottom — hero card signature */
    .glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 72% 36% at 50% 100%, rgba(230,242,141,0.32) 0%, rgba(230,242,141,0.11) 50%, transparent 78%),
        radial-gradient(ellipse 115% 22% at 50% 110%, rgba(230,242,141,0.13) 0%, transparent 58%);
    }

    /* ── top-left wordmark, like the nav logo ── */
    .logo {
      position: absolute; top: 42px; left: 56px;
      font-weight: 700; font-size: 24px; letter-spacing: -0.01em;
      color: #F5F5F7;
    }
    .logo .shaka { margin-right: 10px; }

    /* ── centered B&W polaroid ── */
    .polaroid {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -52%) rotate(-2.5deg);
      background: #F6F4EF; border-radius: 5px;
      padding: 9px 9px 0;
      box-shadow:
        rgba(0,0,0,0.35) 0 0 0 1px,
        rgba(0,0,0,0.35) 0 2px 4px 0,
        rgba(0,0,0,0.6) 0 18px 40px -14px;
      z-index: 3;
    }
    .ph {
      width: 272px; height: 300px; overflow: hidden;
      border-radius: 2px; position: relative; background: #ddd;
    }
    .ph img {
      position: absolute; width: 640px; left: -64px; top: -195px;
      filter: grayscale(1) contrast(1.1) brightness(1.03);
    }
    .pcap {
      font-family: 'Caveat', cursive; font-weight: 600;
      font-size: 30px; color: #252525; text-align: center;
      padding: 6px 0 12px;
    }

    /* ── orbit tags — hero-verb styles ── */
    .tag { position: absolute; white-space: nowrap; z-index: 2; }
    .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

    /* "0 → 1" — Figma selection box (hv-scale) */
    .t-zero { top: 128px; left: 178px; font-size: 40px; color: #0F8EDD; transform: rotate(-2deg); }
    .selbox { position: relative; display: inline-block; padding: 2px 10px; }
    .selbox::before {
      content: ""; position: absolute; inset: -2px -8px;
      border: 2px solid #0D99FF; border-radius: 2px;
    }
    .h { position: absolute; width: 10px; height: 10px; background: #fff; border: 2px solid #0D99FF; border-radius: 1px; z-index: 1; }
    .h.tl { top: -2px; left: -8px; transform: translate(-50%,-50%); }
    .h.tr { top: -2px; right: -8px; transform: translate(50%,-50%); }
    .h.bl { bottom: -2px; left: -8px; transform: translate(-50%,50%); }
    .h.br { bottom: -2px; right: -8px; transform: translate(50%,50%); }

    /* "Conversational AI" — convert-green + check badge */
    .t-convai { top: 138px; right: 96px; font-size: 30px; color: #84BF86; transform: rotate(1.5deg); display: flex; align-items: center; gap: 12px; }
    .badge {
      width: 34px; height: 34px; border-radius: 50%;
      background: #1FA34A; display: inline-flex; align-items: center; justify-content: center;
      flex: none;
    }
    .badge svg { display: block; }

    /* "Metrics Driven" — connect-coral + up-right arrow */
    .t-metrics { bottom: 158px; right: 142px; font-size: 30px; color: #FB9393; transform: rotate(-1.5deg); display: flex; align-items: center; gap: 10px; }
    .t-metrics svg { display: block; }

    /* "San Francisco" — lime hero-hi chip */
    .t-sf {
      bottom: 168px; left: 168px; transform: rotate(2deg);
      font-weight: 700; font-size: 27px; color: #252525;
      background: #E6F28D; border-radius: 8px; padding: 6px 16px;
    }

    /* quiet mono facts */
    .t-soft { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 19px; color: rgba(245,245,247,0.55); }
    .t-ds { top: 320px; left: 128px; transform: rotate(-1deg); }
    .t-yrs { top: 320px; right: 118px; transform: rotate(1deg); }

    /* hand-drawn connector arrows (Caveat energy) */
    .arrows { position: absolute; inset: 0; z-index: 1; }
    .arrows path { stroke: rgba(245,245,247,0.4); stroke-width: 2.5; fill: none; stroke-linecap: round; }
  </style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow"></div>

  <svg class="arrows" width="1200" height="630" viewBox="0 0 1200 630">
    <!-- from "0 → 1" toward the polaroid -->
    <path d="M 342 178 C 388 202, 412 226, 438 254" />
    <path d="M 430 240 L 438 254 L 422 256" />
    <!-- from "Conversational AI" toward the polaroid -->
    <path d="M 872 192 C 826 218, 796 238, 764 262" />
    <path d="M 780 252 L 764 262 L 780 268" />
    <!-- from "San Francisco" toward the polaroid -->
    <path d="M 352 452 C 394 434, 420 420, 448 400" />
    <path d="M 436 398 L 448 400 L 442 412" />
  </svg>

  <div class="logo"><span class="shaka">🤙</span>Bhanu Kowshik</div>

  <div class="tag t-zero mono">
    <span class="selbox">0 → 1
      <span class="h tl"></span><span class="h tr"></span>
      <span class="h bl"></span><span class="h br"></span>
    </span>
  </div>

  <div class="tag t-convai mono">
    <span class="badge">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3.5 9.5 L7.2 13 L14.5 5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    Conversational AI
  </div>

  <div class="tag t-metrics mono">
    <svg width="30" height="30" viewBox="0 0 30 30"><path d="M6 24 L24 6 M12 6 H24 V18" stroke="#F2674B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Metrics Driven
  </div>

  <div class="tag t-sf">San Francisco&nbsp;&nbsp;📍</div>

  <div class="tag t-soft t-ds">Design Systems</div>
  <div class="tag t-soft t-yrs">5+ yrs shipping</div>

  <div class="polaroid">
    <div class="ph"><img src="About  me Pictures/Kayaking.jpeg" alt="" /></div>
    <div class="pcap">Hi, I'm Bhanu 🤙</div>
  </div>
</body>
</html>
