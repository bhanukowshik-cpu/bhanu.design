<!DOCTYPE html>
<!-- Source for images/og-image.jpg (social share card) — v15:
     the whole scene is a Soul Cinema plate (images/og-plate.jpg — Bhanu with
     the orb horizon and eclipse glow photographed in); HTML adds only type.
     Re-render after edits:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
       --screenshot=og-2x.png --window-size=1200,630 --force-device-scale-factor=2 \
       --virtual-time-budget=10000 --hide-scrollbars "file://$PWD/og-image.html"
     sips -z 630 1200 og-2x.png --out og-tmp.png && sips -s format jpeg -s formatOptions 85 og-tmp.png --out images/og-image.jpg -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: #05070c;
      font-family: 'Instrument Sans', system-ui, sans-serif;
      color: #EFF3F8;
    }

    /* the plate — the whole scene, photographed */
    .plate { position: absolute; inset: 0; }
    .plate img { width: 1200px; height: 675px; object-fit: cover; object-position: 50% 42%; }

    /* a breath of darkness behind the type column */
    .scrim {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(to right, rgba(4,6,11,.62) 0%, rgba(4,6,11,.34) 26%, transparent 46%);
    }

    /* ── type ── */
    .n0 {
      position: absolute; left: 96px; top: 148px; z-index: 4;
      font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400;
      font-size: 40px; line-height: 1; letter-spacing: -0.004em; color: #EFF3F8;
      text-shadow: 0 3px 26px rgba(2,4,8,.8);
    }
    .n1 {
      position: absolute; left: 92px; top: 214px; z-index: 4;
      font-weight: 600; font-size: 118px; line-height: 1.0;
      letter-spacing: -0.032em; color: #EFF3F8;
      text-shadow: 0 6px 44px rgba(2,4,8,.75);
    }
    .n2 {
      position: absolute; left: 96px; top: 328px; z-index: 4;
      font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400;
      font-size: 128px; line-height: 1.0; letter-spacing: -0.01em; color: #EFF3F8;
      text-shadow: 0 6px 44px rgba(2,4,8,.75);
    }

    /* ── grouped fact pills on the orb horizon ── */
    .pills { position: absolute; left: 96px; top: 540px; display: flex; gap: 13px; z-index: 4; }
    .pill {
      display: inline-flex; align-items: stretch;
      border: 1px solid rgba(239,243,248,0.14); border-radius: 17px;
      background: rgba(8,12,19,.66);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font-size: 16px; font-weight: 500; letter-spacing: -0.012em;
      color: rgba(239,243,248,.9); white-space: nowrap;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .pill span { display: inline-flex; align-items: center; padding: 11px 18px; }
    .pill span + span { border-left: 1px solid rgba(239,243,248,0.1); }

    .year {
      position: absolute; right: 60px; top: 54px; z-index: 4;
      font-size: 14px; font-weight: 520; letter-spacing: .08em; color: #A9B4C2;
      text-shadow: 0 2px 16px rgba(2,4,8,.8);
    }
  </style>
</head>
<body>
  <div class="plate"><img src="images/og-plate.jpg" alt="" /></div>
  <div class="scrim"></div>

  <div class="n0">AI Native Product Designer</div>
  <div class="n1">Bhanu</div>
  <div class="n2">Kowshik</div>

  <div class="pills">
    <span class="pill"><span>0 → 1</span><span>Conversational AI</span><span>Impact Driven</span></span>
    <span class="pill"><span>5+ Years</span><span>Builder</span></span>
    <span class="pill"><span>San Francisco</span></span>
  </div>

  <div class="year">PORTFOLIO — 2026</div>
</body>
</html>
