<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF World Lab</title>
<meta name="robots" content="noindex">
<!--
  SF World · prototype (12 Nov). An isometric toy diorama of San Francisco in the low-poly,
  flat-colour style the owner pointed at (pins with cards, chimney smoke, pigeons, people, cars).
  Everything is modelled in code (Three.js r160, vendored), no downloaded assets.
  One block for now: the Verified Call tower + plaza, a Painted Ladies row, a park with Bhanu on a
  bench, a cable-car street, the waterfront with a pier, sea lions and a ferry, and the Golden Gate
  running out into the bay. Lighting follows SF's real sun (?hour=17.5 to force a time).
  Drag to pan · wheel / +/- to zoom · click a pin or a postcard to open its card.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1F1B24;--paper:#FFFCF8;--muted:#6E6774;--pin:#D9483B;--font:'Montserrat',sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#6E9FA3;font-family:var(--font);color:var(--ink)}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#gl.drag{cursor:grabbing}
  .pill{position:fixed;z-index:5;background:var(--paper);border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 30px -12px rgba(20,30,40,.35)}
  .brand{left:20px;top:20px;padding:14px 20px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px}
  .brand small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .nav{right:20px;top:20px;padding:12px 10px;display:flex;gap:4px}
  .nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:4px 12px;border-radius:10px}
  .nav a:hover{background:#F1ECE4}
  .zoom{right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;background:none;box-shadow:none}
  .zoom button{width:52px;height:52px;border:0;border-radius:14px;background:var(--paper);font-size:22px;color:var(--ink);cursor:pointer;
               box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 30px -12px rgba(20,30,40,.35)}
  .zoom button:hover{background:#F6F1EA}
  .passport{left:20px;bottom:20px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer}
  .passport i{width:30px;height:30px;border-radius:8px;background:var(--pin);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
  .status{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;font-family:var(--mono);font-size:12px;
          letter-spacing:.06em;color:#fff;opacity:.85;white-space:nowrap}
  /* labels that follow 3D anchors */
  .tag{position:fixed;left:0;top:0;z-index:4;pointer-events:auto;cursor:pointer;transform:translate(-50%,-100%);
       background:var(--paper);border-radius:12px;padding:8px 14px 9px;white-space:nowrap;
       box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 24px -10px rgba(20,30,40,.4);transition:opacity .25s}
  .tag small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
  .tag b{font-size:15px}
  .tag.post{padding:6px 8px;border-radius:9px}
  .tag.post svg{display:block;width:18px;height:18px}
  .tag.hide{opacity:0;pointer-events:none}
  /* card */
  .card{position:fixed;z-index:6;right:clamp(16px,6vw,110px);top:50%;width:min(390px,calc(100vw - 32px));transform:translate(0,calc(-50% + 16px));
        opacity:0;pointer-events:none;background:var(--paper);border-radius:22px;padding:24px 24px 20px;
        box-shadow:0 2px 0 rgba(0,0,0,.08),0 30px 60px -20px rgba(20,30,40,.45);transition:opacity .35s,transform .35s cubic-bezier(.2,.7,.2,1)}
  .card.on{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
  .card .eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
  .card h2{font-size:27px;font-weight:700;letter-spacing:-.01em;margin:6px 0 10px}
  .card p{font-size:15px;line-height:1.55;color:#3D3843}
  .card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px;padding-top:14px;border-top:1px solid #ECE5DB}
  .card .stats b{display:block;font-size:19px}
  .card .stats small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
  .card .row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid #ECE5DB;font-size:14px;font-weight:600}
  .card .row a{color:var(--ink)}
  .card .x{position:absolute;right:-12px;top:-12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--paper);font-size:20px;cursor:pointer;
           box-shadow:0 2px 0 rgba(0,0,0,.08),0 8px 18px -8px rgba(20,30,40,.4)}
  .card .stamp{float:right;margin:0 0 6px 12px;width:66px;height:80px;border:2px solid #3F7C83;border-radius:8px;color:#3F7C83;
               font:700 10px/1.2 var(--mono);display:grid;place-items:center;text-align:center;transform:rotate(4deg);padding:6px}
  /* case study overlay (owner, 12 Nov): one clean pop-up over the world, led by metrics + visuals */
  .cs-back{position:fixed;inset:0;z-index:8;background:rgba(24,30,38,.28);-webkit-backdrop-filter:blur(6px) saturate(1.1);backdrop-filter:blur(6px) saturate(1.1);
           opacity:0;pointer-events:none;transition:opacity .35s}
  .cs-back.on{opacity:1;pointer-events:auto}
  .cs{position:fixed;z-index:9;left:50%;top:50%;width:min(1080px,calc(100vw - 32px));max-height:min(88vh,920px);overflow:auto;overscroll-behavior:contain;
      transform:translate(-50%,calc(-50% + 24px)) scale(.985);opacity:0;pointer-events:none;background:var(--paper);border-radius:28px;
      padding:22px clamp(20px,3.4vw,44px) 34px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 40px 90px -30px rgba(20,30,40,.55);
      transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin}
  .cs.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  .cs-top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-22px;margin:-22px calc(-1 * clamp(20px,3.4vw,44px)) 0;
          padding:18px clamp(20px,3.4vw,44px) 14px;background:linear-gradient(var(--paper) 78%,rgba(255,252,248,0));z-index:2}
  .pager{display:flex;align-items:center;gap:4px;background:#F2EDE5;border-radius:14px;padding:4px}
  .pager button{border:0;background:none;font:600 14px var(--font);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
  .pager button:hover{background:#E7E0D5}
  .pager span{font-size:13px;color:var(--muted);padding:0 6px;min-width:46px;text-align:center}
  .cs-x{width:42px;height:42px;border:0;border-radius:12px;background:#F2EDE5;font-size:20px;cursor:pointer;color:var(--ink)}
  .cs-x:hover{background:#E7E0D5}
  .cs h2{font-size:clamp(34px,4.4vw,54px);font-weight:700;letter-spacing:-.025em;margin:18px 0 6px}
  .cs .meta{font-size:15px;color:var(--muted);font-weight:500}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,20px);margin:26px 0 30px}
  .tile .vis{aspect-ratio:4/4.4;border-radius:20px;background:var(--tint,#EFE8DD);overflow:hidden;display:grid;place-items:center;position:relative}
  .tile .vis img,.tile .vis video{width:100%;height:100%;object-fit:var(--fit,cover);display:block}
  .tile .vis.pad img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(30,30,40,.18))}
  .tile .num{display:block;font-size:clamp(24px,2.4vw,32px);font-weight:700;letter-spacing:-.02em;margin-top:14px;line-height:1.05}
  .tile .lab{display:block;font-size:14.5px;line-height:1.4;color:#4A4450;margin-top:6px;max-width:30ch}
  .tile .ft{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .cs .story{font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:#2E2933;max-width:62ch}
  .cs .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .cs .cta a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;padding:13px 20px;border-radius:14px}
  .cs .cta a.pri{background:var(--ink);color:#fff}
  .cs .cta a.sec{background:#F2EDE5;color:var(--ink)}
  @media (max-width:767px){
    .tiles{grid-template-columns:1fr 1fr}
    .tiles .tile:nth-child(3){grid-column:1 / -1}
    .tiles .tile:nth-child(3) .vis{aspect-ratio:16/9}
    .cs{max-height:92vh;border-radius:22px}
  }
  @media (max-width:767px){
    .nav{display:none}
    .card{top:auto;bottom:86px;right:16px;left:16px;width:auto;transform:translate(0,16px)}
    .card.on{transform:none}
    .zoom button{width:44px;height:44px}
  }
</style>
</head>
<body>
<canvas id="gl" aria-label="Isometric toy model of a San Francisco block: the Verified Call tower, Painted Ladies, a park, a cable car, the waterfront and the Golden Gate"></canvas>

<div class="pill brand">Bhanu Kowshik <small>San Francisco</small></div>
<nav class="pill nav"><a href="./#about">About me</a><a href="./#work">Work</a><a href="./#contact">Contact</a></nav>
<div class="pill passport" id="passport" title="Postcards found"><i>✉</i><span id="pcount">0/4</span></div>
<div class="pill zoom">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zhome" aria-label="Recenter">◎</button>
</div>
<div class="status" id="status"></div>

<div class="cs-back" id="csBack"></div>
<section class="cs" id="cs" role="dialog" aria-modal="true" aria-labelledby="csTitle">
  <div class="cs-top">
    <div class="pager"><button id="csPrev">Previous</button><span id="csIdx">1 of 3</span><button id="csNext">Next</button></div>
    <button class="cs-x" id="csX" aria-label="Close">×</button>
  </div>
  <div id="csBody"></div>
</section>
<aside class="card" id="card" aria-live="polite">
  <button class="x" id="cardX" aria-label="Close">×</button>
  <div id="cardBody"></div>
</aside>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const Q = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RAFSHIM = Q.has('rafshim');

/* ══════════════ renderer, camera, scene ══════════════ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const WATER = new THREE.Color('#6E9FA3');
scene.background = WATER.clone();

const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 500);
const view = { tx: -2, tz: -4, zoom: 0.84, az: Math.PI / 4, el: 0.62 };   // az 45° · elevation ~35°
const HOME = { tx: -2, tz: -4, zoom: 0.84 };
function placeCamera() {
  const W = innerWidth || 1200, H = innerHeight || 800;
  const span = 62 / view.zoom * (W < H ? 1.25 : 1);                 // world units across the shorter side
  const a = W / H;
  cam.left = -span * a / 2; cam.right = span * a / 2; cam.top = span / 2; cam.bottom = -span / 2;
  if (a < 1) { cam.left = -span / 2; cam.right = span / 2; cam.top = span / a / 2; cam.bottom = -span / a / 2; }
  const d = 120;
  cam.position.set(view.tx + Math.cos(view.el) * Math.cos(view.az) * d, Math.sin(view.el) * d,
                   view.tz + Math.cos(view.el) * Math.sin(view.az) * d);
  cam.lookAt(view.tx, 0, view.tz);
  cam.updateProjectionMatrix();
}
function resize() {
  renderer.setSize(innerWidth || 1200, innerHeight || 800, false);
  placeCamera();
}
addEventListener('resize', resize);

/* ══════════════ materials + little builders ══════════════ */
const matCache = {};
const M = (hex, o = {}) => {
  const k = hex + JSON.stringify(o);
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.88, metalness: 0, ...o }));
};
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
const rbox = (w, h, d, r = 0.12) => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2) * 0.999);
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();   // seeded

/* ══════════════ ground: island, streets, sidewalks ══════════════ */
const ISLAND = 64;                                   // square island, -32..32
// stone base + sidewalk top
mesh(rbox(ISLAND + 1.2, 3, ISLAND + 1.2, 0.5), M('#B3A28B'), 0, -1.6, 0);
mesh(box(ISLAND, 0.2, ISLAND), M('#E9DFCD'), 0, 0, 0).castShadow = false;
// streets: main street along x (z ≈ 2), cable-car street along z (x ≈ -4)
const ASPHALT = M('#62666E');
mesh(box(ISLAND, 0.06, 7), ASPHALT, 0, 0.13, 2).castShadow = false;
mesh(box(7, 0.06, ISLAND), ASPHALT, -4, 0.13, 0).castShadow = false;
// lane dashes + crosswalks
const PAINT = M('#F3EFE6');
for (let x = -30; x < 30; x += 4) if (Math.abs(x + 4) > 5) mesh(box(1.8, 0.02, 0.18), PAINT, x, 0.17, 2).castShadow = false;
for (const [cx, cz, along] of [[-4, -2.6, 'x'], [-4, 6.6, 'x'], [-9.6, 2, 'z'], [1.6, 2, 'z']])
  for (let i = -2.6; i <= 2.6; i += 0.9)
    mesh(along === 'x' ? box(0.5, 0.02, 1.4) : box(1.4, 0.02, 0.5), PAINT, along === 'x' ? cx + i : cx, 0.17, along === 'x' ? cz : cz + i).castShadow = false;
// cable-car rails
for (const dx of [-0.6, 0.6]) mesh(box(0.08, 0.04, ISLAND), M('#8A8F96', { metalness: 0.4, roughness: 0.5 }), -4 + dx, 0.17, 0).castShadow = false;
mesh(box(0.12, 0.03, ISLAND), M('#3F4247'), -4, 0.165, 0).castShadow = false;           // the cable slot
// curbs
for (const z of [-1.5, 5.5]) mesh(box(ISLAND, 0.28, 0.25), M('#D7CCB8'), 0, 0.14, z);
for (const x of [-7.5, -0.5]) mesh(box(0.25, 0.28, ISLAND), M('#D7CCB8'), x, 0.14, 0);

/* ══════════════ water ══════════════ */
const waterU = { uTime: { value: 0 }, uCol: { value: WATER.clone() }, uLight: { value: new THREE.Color('#9CC6C6') } };
const water = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShaderMaterial({
  uniforms: waterU,
  vertexShader: `varying vec2 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uTime; uniform vec3 uCol, uLight; varying vec2 vW;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
    void main(){
      vec2 p = vW * vec2(0.55, 1.6) + vec2(uTime * 0.25, uTime * 0.05);
      float s = smoothstep(0.78, 0.93, n(p)) * 0.32 + smoothstep(0.84, 0.97, n(p * 2.3 - uTime * 0.1)) * 0.18;
      // shoreline foam: distance to the island square
      vec2 q = abs(vW) - vec2(${(ISLAND / 2 + 0.6).toFixed(1)});
      float d = length(max(q, 0.)) + min(max(q.x, q.y), 0.);
      float foam = (1. - smoothstep(0.0, 1.6, d)) * (0.55 + 0.45 * sin(d * 5. - uTime * 2.));
      vec3 c = mix(uCol, uLight, s);
      c = mix(c, vec3(0.96, 0.97, 0.95), clamp(foam, 0., 1.) * 0.7);
      gl_FragColor = vec4(c, 1.);
      #include <colorspace_fragment>
    }`
}));
water.rotation.x = -Math.PI / 2; water.position.y = -1.2; scene.add(water);

/* ══════════════ people (toy figures that walk) ══════════════ */
const SKIN = ['#E9B996', '#C98E68', '#8D5B3E', '#F1C9A7'];
const SHIRT = ['#3E6FB0', '#D9483B', '#3F8F6B', '#E7B54A', '#7E5BA6', '#2F3440', '#E7E1D6'];
const PANTS = ['#2E3442', '#4B5563', '#6B4F3A', '#1F2937', '#8C7A62'];
function person(o = {}) {
  const g = new THREE.Group();
  const skin = M(o.skin || SKIN[Math.floor(rand() * SKIN.length)]);
  const shirt = M(o.shirt || SHIRT[Math.floor(rand() * SHIRT.length)]);
  const pants = M(o.pants || PANTS[Math.floor(rand() * PANTS.length)]);
  const hip = new THREE.Group(); hip.position.y = 0.62; g.add(hip);
  const legs = [-0.11, 0.11].map(x => { const l = new THREE.Group(); l.position.set(x, 0, 0); hip.add(l);
    mesh(rbox(0.17, 0.6, 0.2, 0.06), pants, 0, -0.3, 0, l); mesh(rbox(0.19, 0.08, 0.3, 0.03), M('#2A2522'), 0, -0.6, 0.04, l); return l; });
  mesh(rbox(0.46, 0.62, 0.3, 0.12), shirt, 0, 0.33, 0, hip);
  const arms = [-0.29, 0.29].map(x => { const a = new THREE.Group(); a.position.set(x, 0.58, 0); hip.add(a);
    mesh(rbox(0.13, 0.5, 0.15, 0.05), shirt, 0, -0.23, 0, a); mesh(new THREE.SphereGeometry(0.07, 10, 8), skin, 0, -0.5, 0, a); return a; });
  mesh(new THREE.SphereGeometry(0.2, 16, 12), skin, 0, 0.86, 0, hip);
  const hair = mesh(new THREE.SphereGeometry(0.21, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M(o.hair || ['#2B211C', '#5A3A24', '#141414', '#B98A4E'][Math.floor(rand() * 4)]), 0, 0.9, -0.01, hip);
  hair.rotation.x = -0.25;
  if (o.bag) mesh(rbox(0.3, 0.32, 0.1, 0.05), M(o.bag), 0.3, 0.1, 0, hip);
  g.userData = { legs, arms, hip };
  g.scale.setScalar(o.scale || 1);
  scene.add(g); return g;
}
function poseWalk(p, phase, speedK = 1) {
  const s = Math.sin(phase) * 0.55 * speedK, u = p.userData;
  u.legs[0].rotation.x = s; u.legs[1].rotation.x = -s;
  u.arms[0].rotation.x = -s * 0.8; u.arms[1].rotation.x = s * 0.8;
  u.hip.position.y = 0.62 + Math.abs(Math.cos(phase)) * 0.05;
}
function poseSit(p) {
  const u = p.userData; u.hip.position.y = 0.55;
  u.legs.forEach(l => { l.rotation.x = -1.45; }); u.arms.forEach(a => { a.rotation.x = -0.9; });
}

/* walkers loop along sidewalk paths (closed polylines) */
const walkers = [];
function addWalker(path, o = {}) {
  const p = person(o); const segs = [];
  let len = 0;
  for (let i = 0; i < path.length; i++) { const a = path[i], b = path[(i + 1) % path.length]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push({ a, b, l, s: len }); len += l; }
  walkers.push({ p, segs, len, d: rand() * len, v: o.speed || (1.1 + rand() * 0.4) });
}
function stepWalkers(dt) {
  for (const w of walkers) {
    w.d = (w.d + w.v * dt) % w.len;
    const s = w.segs.find(q => w.d >= q.s && w.d < q.s + q.l) || w.segs[0];
    const t = (w.d - s.s) / s.l;
    w.p.position.set(s.a[0] + (s.b[0] - s.a[0]) * t, 0.12, s.a[1] + (s.b[1] - s.a[1]) * t);
    w.p.rotation.y = Math.atan2(s.b[0] - s.a[0], s.b[1] - s.a[1]);
    poseWalk(w.p, w.d * 3.4);
  }
}

/* ══════════════ trees, benches, lamps ══════════════ */
const LEAF = ['#9DB04A', '#C9B23D', '#E2A23B', '#7FA34A', '#D78A36'];
function tree(x, z, s = 1, palette) {

function glassTex(cols, floors, seed) {
  // curtain wall: mullion grid, warm offices with little desks + people, a few dark bays
  return canvasTex(cols * 64, floors * 64, (g, w, h) => {
    let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let f = 0; f < floors; f++) for (let c = 0; c < cols; c++) {
      const x = c * 64, y = f * 64, lit = r() > 0.6;
      const grd = g.createLinearGradient(x, y, x, y + 64);
      if (lit) { grd.addColorStop(0, '#FFE6B4'); grd.addColorStop(1, '#F4C077'); } else { grd.addColorStop(0, '#A9C8E4'); grd.addColorStop(1, '#6F96BF'); }
      g.fillStyle = grd; g.fillRect(x, y, 64, 64);
      if (lit) {
        g.fillStyle = 'rgba(80,60,50,.55)'; g.fillRect(x + 8, y + 40, 48, 5);                       // desk
        if (r() > 0.4) { g.fillStyle = '#3D5A80'; g.fillRect(x + 14 + r() * 26, y + 30, 10, 9); }     // monitor
        if (r() > 0.45) { g.fillStyle = '#3A3340'; const px = x + 10 + r() * 40;                    // a person
          g.beginPath(); g.arc(px, y + 24, 5, 0, 7); g.fill(); g.fillRect(px - 5, y + 29, 10, 13); }
      }
      g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x + 6, y + 4, 16, 56);                         // sky glint
    }
    g.strokeStyle = '#2A3442'; g.lineWidth = 5;
    for (let c = 0; c <= cols; c++) { g.beginPath(); g.moveTo(c * 64, 0); g.lineTo(c * 64, h); g.stroke(); }
    g.lineWidth = 9; g.strokeStyle = '#D9D3C7';
    for (let f = 0; f <= floors; f++) { g.beginPath(); g.moveTo(0, f * 64); g.lineTo(w, f * 64); g.stroke(); }
  });
}

function sfHour() {
  if (Q.has('hour')) return +Q.get('hour');
  const p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date());
  return (+p.find(x => x.type === 'hour').value % 24) + (+p.find(x => x.type === 'minute').value) / 60;
}
function setTimeOfDay(h) {
  // sun arc from 6:45 to 17:00 (Nov), azimuth sweeping east → south → west
  const t = (h - 6.75) / (17 - 6.75);
  const alt = Math.sin(Math.PI * THREE.MathUtils.clamp(t, 0, 1)) * 38 * (t > 0 && t < 1 ? 1 : 0);   // degrees
  const az = THREE.MathUtils.lerp(-70, 70, THREE.MathUtils.clamp(t, 0, 1)) * Math.PI / 180;
  const el = Math.max(alt, 8) * Math.PI / 180;
  sun.position.set(Math.sin(az) * 120 * Math.cos(el), Math.sin(el) * 120, Math.cos(az) * 120 * Math.cos(el) * -1 + 40);
  const day = THREE.MathUtils.smoothstep(alt, 0, 14), golden = 1 - THREE.MathUtils.smoothstep(alt, 6, 22);
  const night = t <= 0 || t >= 1 ? 1 : 1 - THREE.MathUtils.smoothstep(alt, -2, 4);
  sun.color.set('#FFF6E6').lerp(new THREE.Color('#FFB46B'), golden * 0.8);
  sun.intensity = 0.25 + 2.3 * day;
  hemi.intensity = 0.35 + 0.75 * day;
  hemi.color.set('#E9F1FF').lerp(new THREE.Color('#33406E'), night);
  scene.background.copy(WATER).lerp(new THREE.Color('#1D2B3D'), night * 0.85);
  waterU.uCol.value.copy(WATER).lerp(new THREE.Color('#1D2B3D'), night * 0.85).lerp(new THREE.Color('#C98A6A'), golden * day * 0.25);
  waterU.uLight.value.set('#9CC6C6').lerp(new THREE.Color('#F2B37A'), golden * 0.6).lerp(new THREE.Color('#40587A'), night);
  const glow = night * 1.2 + golden * 0.25;
  lampHeads.forEach(l => l.material.emissiveIntensity = glow * 1.6);
  towerWindows.forEach(m => m.emissiveIntensity = 0.05 + glow * 0.9);
  renderer.toneMappingExposure = 1.05 + night * 0.25;
  document.getElementById('status').textContent =
    `San Francisco · ${new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour: 'numeric', minute: '2-digit' }).format(new Date())}` +
    (Q.has('hour') ? ` (showing ${String(Math.floor(h)).padStart(2, '0')}:${String(Math.round(h % 1 * 60)).padStart(2, '0')})` : '');
}

    const x = (tmp.x + 1) / 2 * W, y = (1 - tmp.y) / 2 * H;
    a.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;
    a.el.classList.toggle('hide', x < -40 || x > W + 40 || y < -40 || y > H + 60);
  }
}
let lastSun = -1;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (!REDUCED) update(dt);
  if (performance.now() - lastSun > 60000 || lastSun < 0) { setTimeOfDay(sfHour()); lastSun = performance.now(); }
  sun.target.position.set(view.tx, 0, view.tz); sun.position.add(new THREE.Vector3(0, 0, 0));
  renderer.render(scene, cam);
  project();
}
function loop() { frame(); requestAnimationFrame(loop); }
resize();
if (RAFSHIM) setInterval(frame, 33); else loop();
window.__world = { view, scene, cam, frame, setHour: h => { Q.set('hour', h); lastSun = -1; frame(); }, openCard };
</script>
