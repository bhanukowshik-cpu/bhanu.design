<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orb embed test</title>
<script>
  /* RAF shim — the local preview tab is backgrounded, which suspends
     requestAnimationFrame and freezes WebGL. Pump queued callbacks via a timer
     so the orb actually renders for screenshotting. Harmless when visible. */
  (function () {
    var queue = [];
    window.requestAnimationFrame = function (cb) { queue.push(cb); return queue.length; };
    window.cancelAnimationFrame = function () {};
    function pump() {
      var now = performance.now();
      var cbs = queue; queue = [];
      for (var i = 0; i < cbs.length; i++) { try { cbs[i](now); } catch (e) {} }
    }
    setInterval(pump, 33);
    var ch = new MessageChannel();
    ch.port1.onmessage = pump;
    setInterval(function () { ch.port2.postMessage(0); }, 33);
  })();
</script>
<style>
  *{margin:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(120% 90% at 50% 120%, #241a3a 0%, #12101c 45%, #0b0a10 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    font-family:system-ui,sans-serif;color:#cfcbe0;padding-bottom:8vh;gap:20px;}
  .row{display:flex;gap:60px;align-items:flex-end;flex-wrap:wrap;justify-content:center;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .cap{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8a86a0;font-family:ui-monospace,monospace;}
  h2{position:fixed;top:20px;left:0;right:0;text-align:center;font-weight:500;color:#9a96b0;font-size:14px;letter-spacing:.1em;text-transform:uppercase;}
</style>
</head>
<body>
  <h2>VoiceOrb — live WebGL2 embed test</h2>
  <div class="row">
    <div class="cell">
      <div id="orb-ember" data-size="240"></div>
      <span class="cap">ember · assistant-speaking</span>
    </div>
    <div class="cell">
      <div id="orb-arctic" data-size="240"></div>
      <span class="cap">arctic · idle</span>
    </div>
    <div class="cell">
      <div id="orb-nebula" data-size="240"></div>
      <span class="cap">nebula · user-speaking</span>
    </div>
  </div>

  <script type="module" src="orb/bhanu-orb.js"></script>
  <script type="module">
    // Wait for the bundle to register the global, then mount three palettes.
    function ready(fn){ if (window.BhanuOrb) return fn(); setTimeout(function(){ready(fn);}, 40); }
    ready(function () {
      const B = window.BhanuOrb;
      B.mount(document.getElementById('orb-ember'),  { palette:'ember',  size:240, state:'assistant-speaking', simulate:'assistant' });
      B.mount(document.getElementById('orb-arctic'), { palette:'arctic', size:240, state:'idle' });
      B.mount(document.getElementById('orb-nebula'), { palette:'nebula', size:240, state:'user-speaking', simulate:'user' });
    });
  </script>
</body>
</html>
