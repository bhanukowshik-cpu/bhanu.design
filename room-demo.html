<!DOCTYPE html>
<html lang="en" data-mode="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene Control — Day &amp; Night · Bhanu Kowshik</title>
<meta name="description" content="Flip the switch and the room obeys — dusk sweeps across a real interior, the lamps flicker on.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/room-day.jpg">
<link rel="preload" as="image" href="assets/room-night.jpg">
<style>
  :root {
    --ink: #EFF3F8;
    --font-heading: 'Montserrat', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --wipe: 2.6s;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0E131B; }
  body { font-family: var(--font-heading); color: var(--ink); }

  /* ─── THE ROOM — day photo, night photo swept in by dusk ── */
  .room {
    position: fixed; inset: 0;
    background-size: cover; background-position: center;
  }
  .room-day   { background-image: url('assets/room-day.jpg'); }
  .room-night {
    background-image: url('assets/room-night.jpg');
    -webkit-mask-image: linear-gradient(105deg, #000 42%, transparent 58%);
    mask-image: linear-gradient(105deg, #000 42%, transparent 58%);
    -webkit-mask-size: 320% 100%;
    mask-size: 320% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: 130% 0;
    mask-position: 130% 0;
    transition: -webkit-mask-position var(--wipe) cubic-bezier(0.6, 0, 0.3, 1),
                mask-position var(--wipe) cubic-bezier(0.6, 0, 0.3, 1);
  }
  [data-mode="night"] .room-night {
    -webkit-mask-position: 0% 0;
    mask-position: 0% 0;
  }

  /* lamp glows — flicker on as the dusk line passes them */
  .lamp {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 202, 120, 0.55) 0%, rgba(255, 202, 120, 0) 70%);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    transition: opacity 0.4s ease;
  }
  @keyframes lamp-flick {
    0%   { opacity: 0; }
    18%  { opacity: 0.9; }
    30%  { opacity: 0.1; }
    46%  { opacity: 1; }
    58%  { opacity: 0.45; }
    72%  { opacity: 1; }
    100% { opacity: 1; }
  }
  [data-mode="night"] .lamp { animation: lamp-flick 1.0s ease-out forwards; }
  [data-mode="night"] .lamp-1 { animation-delay: 1.55s; }
  [data-mode="night"] .lamp-2 { animation-delay: 1.85s; }

  /* ─── GLASS CONTROL BAR — the toggle commands the scene ─── */
  .panel {
    position: fixed; left: 50%; bottom: clamp(26px, 6vh, 64px); transform: translateX(-50%);
    z-index: 2;
    display: flex; align-items: center; gap: clamp(18px, 3vw, 34px);
    padding: 16px clamp(20px, 3vw, 34px);
    border-radius: 999px;
    background: rgba(14, 18, 26, 0.4);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    backdrop-filter: blur(22px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition: background 0.8s ease, border-color 0.8s ease;
  }
  [data-mode="night"] .panel {
    background: rgba(10, 13, 20, 0.55);
    border-color: rgba(255, 255, 255, 0.13);
  }
  .panel-info { text-align: left; }
  .panel-room {
    font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em;
  }
  .panel-sub {
    margin-top: 3px;
    font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.14em;
    color: rgba(239, 243, 248, 0.62);
  }
  .panel-temp {
    font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500;
    color: rgba(239, 243, 248, 0.85);
    padding-left: clamp(16px, 2.4vw, 28px);
    border-left: 1px solid rgba(255, 255, 255, 0.16);
  }

  /* Bhanu's v5 day-night scene toggle — native 2x */
  .mode-toggle {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0; cursor: pointer;
    border-radius: 999px;
    transition: transform 0.15s ease;
  }
  .mode-toggle:active { transform: scale(0.94); }
  .mode-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
  .tt-track {
    position: relative; width: 116px; height: 60px; border-radius: 999px;
    background: linear-gradient(180deg, #9DD8F5 0%, #C2E9FA 100%);
    border: 3px solid rgba(255,255,255,0.40);
    overflow: hidden;
    transition: background 0.5s ease, border-color 0.4s ease;
  }
  .tt-track::after {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 50%;
    border-radius: 999px 999px 50% 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0));
    pointer-events: none; z-index: 10;
  }
  .tt-hill-back  { position: absolute; bottom: 0; left: -5%;  width: 75%; height: 26px; background: #72B87A; border-radius: 50% 60% 0 0; z-index: 1; transition: background 0.5s ease; }
  .tt-hill-front { position: absolute; bottom: 0; right: -8%; width: 62%; height: 22px; background: #5DA066; border-radius: 60% 50% 0 0; z-index: 2; transition: background 0.5s ease; }
  .tt-star { position: absolute; background: rgba(255,255,255,0.9); border-radius: 50%; opacity: 0; transition: opacity 0.4s ease; z-index: 1; }
  .tt-star-1 { width: 5px; height: 5px; top: 10px; left: 16px; }
  .tt-star-2 { width: 4px; height: 4px; top: 22px; left: 36px; }
  .tt-star-3 { width: 4px; height: 4px; top: 12px; left: 54px; }
  .tt-star-4 { width: 3px; height: 3px; top: 26px; left: 22px; }
  [data-mode="night"] .tt-star { opacity: 1; }
  @keyframes tt-twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.12; } }
  [data-mode="night"] .tt-star-1 { animation: tt-twinkle 2.1s ease-in-out infinite; }
  [data-mode="night"] .tt-star-2 { animation: tt-twinkle 1.7s ease-in-out 0.8s infinite; }
  [data-mode="night"] .tt-star-3 { animation: tt-twinkle 2.5s ease-in-out 1.5s infinite; }
  [data-mode="night"] .tt-star-4 { animation: tt-twinkle 1.9s ease-in-out 0.4s infinite; }
  .tt-shoot {
    position: absolute; top: 6px; left: 8px; width: 18px; height: 2px;
    background: linear-gradient(to right, transparent, #FFE87A);
    border-radius: 2px; opacity: 0; transform: rotate(35deg); z-index: 2; pointer-events: none;
  }
  @keyframes tt-shooting-star {
    0%   { opacity: 0; transform: translate(0, 0) rotate(35deg); }
    3%   { opacity: 0.85; }
    15%  { opacity: 0; transform: translate(40px, 16px) rotate(35deg); }
    100% { opacity: 0; transform: translate(40px, 16px) rotate(35deg); }
  }
  [data-mode="night"] .tt-shoot { animation: tt-shooting-star 5s ease-in 2s infinite; }
  .tt-cloud { position: absolute; right: 18px; top: 12px; width: 30px; height: 14px; background: rgba(255,255,255,0.95); border-radius: 20px; opacity: 1; transition: opacity 0.4s ease; z-index: 1; }
  .tt-cloud::before { content: ''; position: absolute; width: 18px; height: 18px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -10px; left: 4px; }
  .tt-cloud::after  { content: ''; position: absolute; width: 14px; height: 14px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -8px; left: 14px; }
  [data-mode="night"] .tt-cloud { opacity: 0; }
  @keyframes tt-cloud-drift { from { transform: translateX(60px); } to { transform: translateX(-170px); } }
  [data-mode="day"] .tt-cloud { animation: tt-cloud-drift 26s linear 0s infinite backwards; }
  .tt-cloud-b { position: absolute; right: 6px; top: 22px; width: 18px; height: 8px; background: rgba(255,255,255,0.95); border-radius: 16px; opacity: 0; transition: opacity 0.4s ease; z-index: 1; pointer-events: none; }
  .tt-cloud-b::before { content: ''; position: absolute; width: 12px; height: 12px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -6px; left: 2px; }
  .tt-cloud-b::after  { content: ''; position: absolute; width: 10px; height: 10px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -6px; left: 8px; }
  [data-mode="night"] .tt-cloud-b { opacity: 0; }
  [data-mode="day"]  .tt-cloud-b { opacity: 0.65; animation: tt-cloud-drift 18s linear 4s infinite backwards; }
  .tt-cloud-c { position: absolute; right: 36px; top: 8px; width: 22px; height: 10px; background: rgba(255,255,255,0.95); border-radius: 16px; opacity: 0; transition: opacity 0.4s ease; z-index: 1; pointer-events: none; }
  .tt-cloud-c::before { content: ''; position: absolute; width: 14px; height: 14px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -8px; left: 2px; }
  .tt-cloud-c::after  { content: ''; position: absolute; width: 12px; height: 12px; background: rgba(255,255,255,0.95); border-radius: 50%; top: -6px; left: 10px; }
  [data-mode="night"] .tt-cloud-c { opacity: 0; }
  [data-mode="day"]  .tt-cloud-c { opacity: 0.45; animation: tt-cloud-drift 34s linear 7.5s infinite backwards; }
  .tt-thumb {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    top: 50%; left: 3px; overflow: hidden;
    background: radial-gradient(circle at 40% 38%, #FFE97A, #F9A800);
    transform: translateX(0) translateY(-50%);
    transition: transform 0.44s cubic-bezier(0.34,1.56,0.64,1), background 0.5s ease;
    z-index: 3;
  }
  .tt-thumb::before, .tt-thumb::after {
    content: ''; position: absolute; border-radius: 50%;
    background: rgba(148,158,185,0.50); opacity: 0; transition: opacity 0.4s ease;
  }
  .tt-thumb::before { width: 14px; height: 14px; top: 8px;  left: 10px; }
  .tt-thumb::after  { width: 10px; height: 10px; top: 26px; left: 28px; }
  [data-mode="night"] .tt-thumb::before, [data-mode="night"] .tt-thumb::after { opacity: 1; }
  [data-mode="day"] .tt-track { background: linear-gradient(180deg, #9DD8F5 0%, #C2E9FA 100%); border-color: rgba(255,255,255,0.40); }
  [data-mode="day"] .tt-hill-back  { background: #72B87A; }
  [data-mode="day"] .tt-hill-front { background: #5DA066; }
  [data-mode="day"] .tt-thumb { transform: translateX(0) translateY(-50%); background: radial-gradient(circle at 40% 38%, #FFE97A, #F9A800); }
  [data-mode="day"] .tt-star  { opacity: 0; }
  [data-mode="day"] .tt-cloud { opacity: 1; }
  [data-mode="day"] .tt-thumb::before, [data-mode="day"] .tt-thumb::after { opacity: 0; }
  [data-mode="night"] .tt-track { background: linear-gradient(180deg, #0B1829 0%, #152238 100%); border-color: rgba(255,255,255,0.10); }
  [data-mode="night"] .tt-track::after { background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0)); }
  [data-mode="night"] .tt-hill-back  { background: #1D3D25; }
  [data-mode="night"] .tt-hill-front { background: #152C1A; }
  [data-mode="night"] .tt-thumb { transform: translateX(56px) translateY(-50%); background: #EEF0F5; }

  @media (max-width: 560px) {
    .panel { gap: 14px; padding: 12px 18px; }
    .panel-temp { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --wipe: 0.25s; }
    [data-mode="night"] .lamp { animation: none; opacity: 1; transition-delay: 0.2s; }
    .tt-thumb { transition: transform 0.15s ease, background 0.15s ease; }
    [data-mode="night"] .tt-star-1, [data-mode="night"] .tt-star-2,
    [data-mode="night"] .tt-star-3, [data-mode="night"] .tt-star-4,
    [data-mode="night"] .tt-shoot,
    [data-mode="day"] .tt-cloud, [data-mode="day"] .tt-cloud-b,
    [data-mode="day"] .tt-cloud-c { animation: none; }
  }
</style>
</head>
<body>

<div class="room room-day" aria-hidden="true"></div>
<div class="room room-night" aria-hidden="true"></div>

<div class="lamp lamp-1" aria-hidden="true" style="width: clamp(200px, 26vw, 360px); aspect-ratio: 1; transform: translate(-50%, -50%);"></div>
<div class="lamp lamp-2" aria-hidden="true" style="width: clamp(130px, 17vw, 240px); aspect-ratio: 1; transform: translate(-50%, -50%);"></div>

<div class="panel">
  <div class="panel-info">
    <div class="panel-room">Living Room</div>
    <div class="panel-sub" id="sceneWord">DAY SCENE</div>
  </div>
  <button class="mode-toggle" id="modeToggle" aria-label="Toggle night scene">
    <span class="tt-track">
      <span class="tt-star tt-star-1"></span>
      <span class="tt-star tt-star-2"></span>
      <span class="tt-star tt-star-3"></span>
      <span class="tt-star tt-star-4"></span>
      <span class="tt-shoot"></span>
      <span class="tt-cloud"></span>
      <span class="tt-cloud-b"></span>
      <span class="tt-cloud-c"></span>
      <span class="tt-hill-back"></span>
      <span class="tt-hill-front"></span>
      <span class="tt-thumb"></span>
    </span>
  </button>
  <div class="panel-temp">72°F</div>
</div>

<script>
(function () {
  var root = document.documentElement;
  var btn  = document.getElementById('modeToggle');
  var word = document.getElementById('sceneWord');
  function flip() {
    var night = root.getAttribute('data-mode') !== 'night';
    root.setAttribute('data-mode', night ? 'night' : 'day');
    word.textContent = night ? 'NIGHT SCENE' : 'DAY SCENE';
  }
  btn.addEventListener('click', flip);
  addEventListener('keydown', function (e) {
    if (e.key === 't' || e.key === 'T') flip();
  });

  /* pin lamp glows to the photo, not the viewport — track the cover crop */
  var IMG_A = 2752 / 1536;
  var LAMPS = [
    { el: document.querySelector('.lamp-1'), x: 0.272, y: 0.42 },
    { el: document.querySelector('.lamp-2'), x: 0.070, y: 0.43 },
  ];
  function placeLamps() {
    var vw = innerWidth, vh = innerHeight;
    var w, h, ox, oy;
    if (vw / vh > IMG_A) { w = vw; h = vw / IMG_A; ox = 0; oy = (vh - h) / 2; }
    else { h = vh; w = vh * IMG_A; oy = 0; ox = (vw - w) / 2; }
    LAMPS.forEach(function (L) {
      L.el.style.left = (ox + L.x * w) + 'px';
      L.el.style.top  = (oy + L.y * h) + 'px';
    });
  }
  placeLamps();
  addEventListener('resize', placeLamps);
})();
</script>
</body>
</html>
