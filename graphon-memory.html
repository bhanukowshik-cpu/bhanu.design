<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answers that remember</title>

<style>
:root{--bg:#2b45ff;--bg2:#1c32e6;--on:#ffffff;--on-mute:rgba(255,255,255,.66)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--on);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  background:radial-gradient(120% 80% at 50% 0%,#4a60ff 0%,var(--bg) 45%,var(--bg2) 100%)}
.bar{display:flex;justify-content:space-between;gap:16px;padding:18px 24px;font:500 12px/1.4 'Geist Mono',monospace;color:var(--on-mute)}
.bar a{color:inherit;text-decoration:none}
.bar a:hover,.bar a:focus-visible{color:var(--on)}
/* Anchored from the top so the card grows downward when the change lands. */
main{display:grid;justify-items:center;align-content:start;padding:max(24px,calc(50svh - 190px)) 16px 24px}
.demo{width:100%;max-width:520px;transition:opacity .45s}
.demo[data-visible="false"]{opacity:0}
.ca{--ca-font:'Geist',system-ui,sans-serif;--ca-mono:'Geist Mono',ui-monospace,monospace}
.free{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:20px 16px 28px;font:500 13px/1.4 'Geist Mono',monospace;color:var(--on-mute)}
.free a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);color:var(--on);text-decoration:none;transition:background .2s,border-color .2s}
.free a:hover,.free a:focus-visible{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6)}
.free svg{width:14px;height:14px}
@media (max-width:560px){
  .bar{flex-direction:column;gap:4px;padding:14px 16px}
  .free{flex-direction:column}
}
</style>
</head>
<body>
<header class="bar">
  <a href="index.html">← bhanu.build</a>
  <span>Unsolicited concept · not affiliated with Graphon · made-up data</span>
</header>

<main>
  <div id="root"></div>
</main>

<footer class="free">
  <span>Free to use. Here's the code:</span>

  <a href="graphon-memory/changed-answer.css" download><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2v8m0 0 3-3m-3 3L5 7M3 13h10"/></svg>changed-answer.css</a>
</footer>

<script type="module" src="graphon-memory/demo.js"></script>
</body>
</html>
