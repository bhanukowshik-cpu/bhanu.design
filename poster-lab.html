/* ════════════════════════════════════════════════════════════════════════
   11. WEATHER — Open-Meteo, live (fog codes 45/48 → dense fog)
   ════════════════════════════════════════════════════════════════════════ */
const WX = c => c == null ? '' : c === 0 ? 'Clear' : c <= 2 ? 'Partly cloudy' : c === 3 ? 'Overcast' : (c === 45 || c === 48) ? 'Fog'
  : c <= 57 ? 'Drizzle' : c <= 67 ? 'Rain' : c <= 77 ? 'Snow' : c <= 82 ? 'Showers' : 'Thunderstorm';
async function fetchWeather() {
  if (Q.has('fog')) return;
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.8199&longitude=-122.4783&current=weather_code,visibility,wind_speed_10m');
    const j = await r.json(), c = j.current || {};
    const code = c.weather_code, vis = c.visibility ?? 20000;
    let fog = 0.22;                                        // SF almost always has a little marine haze
    if (code === 45 || code === 48) fog = 0.95;
    else if (vis < 1000) fog = 0.9; else if (vis < 4000) fog = 0.65; else if (vis < 10000) fog = 0.42;
    if (code === 3) fog = Math.max(fog, 0.4);
    state.fog = fog; state.weather = fog > 0.85 && code !== 45 && code !== 48 ? 'Fog' : WX(code);
    state.windSpeed = c.wind_speed_10m ?? 12;
  } catch (e) { state.weather = ''; }
}

/* ════════════════════════════════════════════════════════════════════════
   12. FRAME
   ════════════════════════════════════════════════════════════════════════ */
const statusEl = document.getElementById('status'), titleEl = document.getElementById('title'), heroEl = document.getElementById('hero');

/* Fit the outlined title to CFG.titleFit of the viewport width (one line), measuring real glyphs. */
function fitTitle() {
  const vw = innerWidth || 1600;
  titleEl.style.fontSize = '';                                   // start from the CSS clamp guess
  const fs = parseFloat(getComputedStyle(titleEl).fontSize);
  const w = titleEl.getBoundingClientRect().width;
  if (w > 0) titleEl.style.fontSize = Math.min(fs * (vw * CFG.titleFit) / w, 150) + 'px';
}
document.fonts?.ready.then(fitTitle);
addEventListener('resize', fitTitle);
fitTitle();
let t0 = performance.now(), lastT = 0, simT = 0;

function resize() {
  state.vw = innerWidth || 1600; state.vh = innerHeight || 900;   // preview panes can report 0×0
  if (!renderer) return;
  renderer.setPixelRatio(DPR);
  renderer.setSize(state.vw, state.vh, false);
  U.uGrain.value = DPR * CFG.grainCss;
  if (reflRT) reflRT.setSize(Math.max(16, Math.round(state.vw * DPR * CFG.reflRtScale)), Math.max(16, Math.round(state.vh * DPR * CFG.reflRtScale)));
  glassSize();
}

function updateSun() {
  const ms = nowMs();
  let { alt, az } = sunAltAz(ms);
  if (state.forceAlt != null) alt = state.forceAlt;
  if (state.forceAz != null) az = state.forceAz;
  state.alt = alt; state.az = az;
  const dir = sunVec(alt, az);
  U.uSunDir.value.copy(dir);
  const P = palette(alt);
  U.uSkyTop.value.copy(P.top); U.uSkyHor.value.copy(P.hor); U.uSunCol.value.copy(P.sun);
  U.uDayK.value = P.k;
  U.uSunUp.value = smooth(-3, 3, alt);
  U.uSunAlt.value = alt;
  state.night = 1 - smooth(-12, -2, alt);
  U.uNight.value = state.night;
  U.uFog.value = state.fog;
  // water colour: teal by day, deep navy at night
  U.uWater.value.setRGB(0.29, 0.53, 0.55).lerp(new THREE.Color(0.06, 0.10, 0.22), state.night * 0.9)
    .lerp(new THREE.Color().copy(P.hor), 0.12);
  // sun on screen
  const uv = project(dir);
  state.sunUV = uv; state.sunInFrame = !!uv && uv[0] > -0.02 && uv[0] < 1.02 && uv[1] > -0.05 && alt > -1;
  if (waterPass) waterPass.mat.uniforms.uGolden.value = smooth(-4, 2, alt) * (1 - smooth(10, 20, alt));
  if (fxPass) {
    const low = smooth(-1, 2, alt) * (1 - smooth(10, 16, alt));
    const inX = uv ? smooth(-0.06, 0.02, uv[0]) * (1 - smooth(0.98, 1.06, uv[0])) : 0;
    fxPass.mat.uniforms.uGlitter.value = low * inX * (1 - state.fog * 0.6);
    if (uv) fxPass.mat.uniforms.uSunUV.value.set(uv[0], uv[1]);
  }
  for (const g of glowPasses) g.mat.uniforms.uGlowK.value = 0.12 + 1.9 * smooth(-6, 3, -alt);   // lamps on at dusk
  for (const f of fogPasses) f.pass.mat.uniforms.uDens.value = Math.min(1, state.fog * f.k * 1.05);
  // clock + weather line
  const time = clockFmt.format(new Date(ms));
  statusEl.textContent = ['San Francisco', time, state.weather].filter(Boolean).join(' · ');
}

/* ════════════════════════════════════════════════════════════════════════
   LIQUID GLASS — the host's chat bar is a real lens over this scene (owner, 12 Nov: "proper liquid
   glass", every browser). The host posts the bar's rect; the scene renders into glassRT and a final
   pass bends it through a rounded-rect glass slab: squircle bezel refraction (strongest at the rim),
   per-channel dispersion, frost, saturation, a smoke tint for legible white text, a specular rim lit
   from the top-left, an inner sheen and a soft contact shadow. WebGL only, so it runs the same in
   Chrome, Safari, iOS and Android. The HTML bar keeps the orb + text (and the click).
   ════════════════════════════════════════════════════════════════════════ */
const glass = { on: false, x: 0, y: 0, w: 0, h: 0, r: 0, a: 0, hv: 0, hvS: 0, ready: false };
let glassRT = null, glassScene = null, glassMat = null;
const FS_GLASS = /* glsl */`
  precision highp float;
  uniform sampler2D tScene; uniform vec2 uRes; uniform vec4 uRect; uniform float uRad, uA, uHover, uDpr;
  varying vec2 vUv;
  float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
  vec3 tap(vec2 px){ return texture2D(tScene, clamp(px / uRes, 0.5 / uRes, 1.0 - 0.5 / uRes)).rgb; }
  void main(){
    vec3 base = texture2D(tScene, vUv).rgb;
    if (uA < 0.002) { gl_FragColor = vec4(base, 1.0); return; }
    vec2 p = gl_FragCoord.xy - uRect.xy;                   // GL space: y up
    float d = sdRR(p, uRect.zw, uRad);
    // contact shadow under the slab (outside only)
    float dS = sdRR(p + vec2(0.0, 8.0 * uDpr), uRect.zw, uRad);
    float sh = (1.0 - smoothstep(-4.0 * uDpr, 26.0 * uDpr, dS)) * 0.2 * uA * step(0.0, d);
    vec3 col = base * (1.0 - sh);
    if (d < 1.0 * uDpr) {
      float t = -d;                                        // depth in from the rim
      float w = min(uRect.w * 0.95, 22.0 * uDpr);          // bezel width
      float x = clamp(t / w, 0.0, 1.0);
      const float e = 1.0;
      vec2 n = vec2(sdRR(p + vec2(e, 0.0), uRect.zw, uRad) - sdRR(p - vec2(e, 0.0), uRect.zw, uRad),
                    sdRR(p + vec2(0.0, e), uRect.zw, uRad) - sdRR(p - vec2(0.0, e), uRect.zw, uRad));
      n = n / max(length(n), 1e-4);                        // outward surface normal (2D)
      float bend = pow(1.0 - x, 2.4);                      // squircle bezel: steep at the rim, flat inside
      vec2 off = -n * bend * w * 0.9;                      // rays bend inward → the rim magnifies
      float br = (0.9 + 2.8 * bend) * uDpr;                // light frost in the clear centre, heavier on the bezel
      vec3 g = vec3(0.0);
      for (int i = 0; i < 8; i++) {
        float an = float(i) * 0.7853982 + 0.3927;
        vec2 o = vec2(cos(an), sin(an)) * br;
        g.r += tap(gl_FragCoord.xy + off * 1.00 + o).r;
        g.g += tap(gl_FragCoord.xy + off * 1.08 + o).g;
        g.b += tap(gl_FragCoord.xy + off * 1.16 + o).b;    // dispersion: blue bends most
      }
      g /= 8.0;
      float l = dot(g, vec3(0.299, 0.587, 0.114));
      g = mix(vec3(l), g, 1.28);                            // glass deepens colour
      g = g * (0.8 - 0.03 * uHover) + 0.045 + 0.05 * uHover; // smoke (legible white text) + lift on hover
      float ny = p.y / uRect.w;                            // -1 bottom … 1 top
      g += smoothstep(0.05, 1.0, ny) * 0.075 * (1.0 - 0.4 * x);   // sheen across the upper half
      vec2 L = normalize(vec2(-0.55, 0.85));               // key light: top-left
      float facing = max(dot(n, L), 0.0), back = max(dot(n, -L), 0.0);
      float rim = 1.0 - smoothstep(0.0, 2.0 * uDpr, t);
      g += rim * (0.62 * facing + 0.3 * back + 0.1);       // specular rim, brightest facing the light
      g += (1.0 - smoothstep(1.5 * uDpr, 9.0 * uDpr, t)) * (1.0 - rim) * 0.08 * facing;  // inner glow
      float aa = 1.0 - smoothstep(-0.7 * uDpr, 0.7 * uDpr, d);
      col = mix(col, clamp(g, 0.0, 1.0), aa * uA);
    }
    gl_FragColor = vec4(col, 1.0);
  }`;
function glassSetup() {
  glassRT = new THREE.WebGLRenderTarget(16, 16, { depthBuffer: false });
  glassMat = new THREE.ShaderMaterial({
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: FS_GLASS, depthTest: false, depthWrite: false,
    uniforms: { tScene: { value: glassRT.texture }, uRes: { value: new THREE.Vector2(16, 16) },
                uRect: { value: new THREE.Vector4() }, uRad: { value: 0 }, uA: { value: 0 },
                uHover: { value: 0 }, uDpr: { value: DPR } } });
  glassScene = new THREE.Scene();
  glassScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), glassMat));
  glassSize();
}
function glassSize() {
  if (!glassRT || !renderer) return;
  const v = renderer.getDrawingBufferSize(new THREE.Vector2());
  glassRT.setSize(v.x, v.y); glassMat.uniforms.uRes.value.copy(v);
  glassMat.uniforms.uDpr.value = v.x / state.vw;
}
function glassRender() {           // returns true when it drew the frame
  if (!glass.on || glass.a < 0.002) return false;
  if (!glassRT) glassSetup();
  const u = glassMat.uniforms, k = u.uDpr.value, H = u.uRes.value.y;
  glass.hvS += (glass.hv - glass.hvS) * 0.15;
  u.uRect.value.set((glass.x + glass.w / 2) * k, H - (glass.y + glass.h / 2) * k, glass.w / 2 * k, glass.h / 2 * k);
  u.uRad.value = Math.min(glass.r, glass.h / 2) * k; u.uA.value = glass.a; u.uHover.value = glass.hvS;
  renderer.setRenderTarget(glassRT); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(glassScene, camera);
  return true;
}

/* ══════════════ hero text inside the scene (behind the bridge) ══════════════ */
let textPass = null, textCanvas = null, textCtx = null, textTex = null, textKey = '';
// intro (owner, 12 Nov): on load the text rises from low in the frame up behind the bridge into place
let introT0 = 0;
function startIntro() { if (!introT0) introT0 = performance.now(); }
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'hero-intro') startIntro(); });
// (12 Nov 2026) the homepage's Pause motion control (WCAG 2.2.2) freezes the scene's life: water, ferry, sea lions, clouds
let PAUSED = false;
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'motion') PAUSED = !!e.data.paused; });
function makeTextPass() {
  textCanvas = document.createElement('canvas'); textCtx = textCanvas.getContext('2d');
  textTex = new THREE.CanvasTexture(textCanvas); textTex.colorSpace = THREE.NoColorSpace;
  const mat = new THREE.ShaderMaterial({ transparent: true, depthTest: false, depthWrite: false,
    uniforms: { tText: { value: textTex }, uA: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D tText; uniform float uA; varying vec2 vUv; void main(){ vec4 c = texture2D(tText, vUv); gl_FragColor = vec4(c.rgb, c.a * uA); }' });
  const mesh = new THREE.Mesh(QUAD, mat); mesh.frustumCulled = false; mesh.renderOrder = order++; mesh.name = 'hero-text'; scene.add(mesh);
  // (12 Nov, owner: "Hi" was cut out by the tower) a faint second copy of the text drawn OVER everything, so a letter behind a tower
  // still reads through it like glass; the towers stay visibly in front
  const ghostMat = mat.clone(); ghostMat.uniforms = { tText: { value: textTex }, uA: { value: 0.36 } };
  // (12 Nov) ghost retired: the cut-out is now tower-only with solid steel (no cables slicing the letters), so the text sits cleanly behind
  document.documentElement.classList.add('text-in-scene');
  document.fonts?.ready.then(() => { textKey = ''; });
  return { mesh, mat, ghostMat };
}
function wrapLines(g, text, maxW) {
  const words = text.split(' '), out = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}
function drawSceneText() {
  if (!textPass) return;
  const W = state.vw, H = state.vh, k = DPR, tagEl = document.getElementById('tagline');
  const op = heroEl.style.opacity === '' ? 1 : +heroEl.style.opacity;
  textPass.mat.uniforms.uA.value = op; if (textPass.ghostMat) textPass.ghostMat.uniforms.uA.value = op * 0.36;
  if (!introT0) {                                                  // embedded: wait for the homepage's loader to finish
    let go = !Q.has('embed') || REDUCED;
    try { go = go || parent.document.documentElement.classList.contains('hero-go'); } catch (e) { go = true; }
    if (go) startIntro();
  }
  const ik = introT0 ? Math.min(1, (performance.now() - introT0) / 1800) : 0;
  const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  const tr = titleEl.getBoundingClientRect(), gr = tagEl.getBoundingClientRect();
  const key = [W, H, tr.left, tr.top, tr.width, tr.height, gr.top, gr.width, gr.height, titleEl.style.fontSize, ik * 400].map(v => Math.round(parseFloat(v) || 0)).join(',');
  if (key === textKey) return; textKey = key;
  // tell the homepage where the tagline settles, so its 'Currently building' pill sits right under it (follows the drop-in)
  try { if (Q.has('embed')) { const kk = Math.max(0, Math.min(1, (ik - 0.14) / 0.86)); parent.postMessage({ type: 'hero-layout', cx: gr.left + gr.width / 2, bottom: gr.bottom - (1 - (1 - Math.pow(1 - kk, 3))) * H * 0.5, a: Math.min(1, 0.25 + kk * 1.5) * (heroEl.style.opacity === '' ? 1 : +heroEl.style.opacity) }, location.origin); } } catch (e) {}
  textCanvas.width = Math.max(1, Math.round(W * k)); textCanvas.height = Math.max(1, Math.round(H * k));
  const g = textCtx; g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, W, H);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const [el, r, alpha, delay] of [[titleEl, tr, 1, 0], [tagEl, gr, 0.92, 0.14]]) {
    const kk = ease((ik - delay) / (1 - delay)), rise = -(1 - kk) * H * 0.5;   // drops in from above the frame and settles behind the towers (owner, 12 Nov)
    const cs = getComputedStyle(el), fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight) || fs * 1.2;
    g.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    try { g.letterSpacing = cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing; } catch (e) {}
    g.fillStyle = `rgba(255,252,248,${alpha * Math.min(1, 0.25 + kk * 1.5)})`;
    const lines = wrapLines(g, el.textContent.trim(), r.width + 2);
    const top = r.top + (r.height - lines.length * lh) / 2;
    lines.forEach((ln, i) => g.fillText(ln, r.left + r.width / 2, top + rise + lh * (i + 0.5)));
  }
  textTex.needsUpdate = true;
}

function frame() {
  if (!state.ready) return;
  drawSceneText();
  const now = performance.now();
  const t = (now - t0) / 1000;
  const dt = Math.min(0.1, Math.max(0, t - lastT)); lastT = t;
  if (!REDUCED && !PAUSED) simT += dt;
  U.uTime.value = simT;
  updateSun();
  updateLife(simT, (REDUCED || PAUSED) ? 0 : dt);
  Audio_.update(simT, dt);
  for (const p of passes) p.mat.uniforms.uView.value.set(...viewFor(p.par));
  const fadeP = REDUCED ? 0 : state.scroll;
  heroEl.style.opacity = String(1 - smooth(0, 0.35, fadeP));
  heroEl.style.transform = `translateY(${-fadeP * 12}vh)`;
  // sky: calm band sits behind the hero type (viewport → scene UV through the sky's view)
  if (skyPass) {
    const r = heroEl.getBoundingClientRect(), v = skyPass.mat.uniforms.uView.value;
    const vy = (r.top + r.height * 0.5) / state.vh;
    skyPass.mat.uniforms.uTitleY.value = v.y + vy * v.w;
    skyPass.mat.uniforms.uTitleK.value = 1 - smooth(0, 0.35, fadeP);
  }
  // reflection pre-pass: only the above-water layers, into a small RT (alpha = coverage).
  // Skipped under a painted plate: its reflections are painted (and shimmered in FS_PLATE).
  if (reflRT && !platePass) {
    for (const p of passes) p.mesh.visible = reflectables.has(p.mesh);
    renderer.setRenderTarget(reflRT); renderer.setClearColor(0x000000, 0); renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(null); renderer.setClearColor(0x0A1430, 1);
    for (const p of passes) p.mesh.visible = true;
  }
  if (!glassRender()) renderer.render(scene, camera);
  state.frames++;
  if (fpsEl) fpsTick(now);
}
// ?fps — on-device frame-rate readout (avg fps + worst frame over the last second)
const fpsEl = new URLSearchParams(location.search).has('fps') ? Object.assign(document.body.appendChild(document.createElement('div')), {
  style: 'position:fixed;left:8px;top:64px;z-index:99;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font:12px/1.3 ui-monospace,monospace;pointer-events:none'
}) : null;
let fpsN = 0, fpsT0 = 0, fpsLast = 0, fpsWorst = 0;
function fpsTick(now) {
  if (fpsLast) fpsWorst = Math.max(fpsWorst, now - fpsLast);
  fpsLast = now; fpsN++;
  if (!fpsT0) fpsT0 = now;
  if (now - fpsT0 >= 1000) {
    fpsEl.textContent = `${Math.round(fpsN * 1000 / (now - fpsT0))} fps · worst ${Math.round(fpsWorst)} ms · DPR ${DPR}`;
    fpsN = 0; fpsT0 = now; fpsWorst = 0;
  }
}
function renderOnce() { if (state.ready) frame(); }

/* loop: RAF normally; setInterval under ?rafshim; slow tick under reduced motion; paused when hidden */
let rafId = 0, shimId = 0;
function loopStart() {
  loopStop();
  if (document.hidden) return;
  if (REDUCED) { frame(); shimId = setInterval(frame, 20000); return; }
  if (RAFSHIM) { shimId = setInterval(frame, 33); return; }
  const tick = () => { frame(); rafId = requestAnimationFrame(tick); }; rafId = requestAnimationFrame(tick);
}
function loopStop() { cancelAnimationFrame(rafId); clearInterval(shimId); }
document.addEventListener('visibilitychange', () => { document.hidden ? loopStop() : loopStart(); });

/* ════════════════════════════════════════════════════════════════════════
   13. SCROLL — Lenis + ScrollTrigger over the spacer (hero push-in)
   ════════════════════════════════════════════════════════════════════════ */
function setupScroll() {
  // embed mode (homepage hero): the host page owns scrolling and posts its hero progress (0..1)
  if (Q.has('embed')) {
    addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.type === 'glass') {               // the host's chat bar: rect in this frame's CSS px
        const g = e.data;
        Object.assign(glass, { on: true, x: +g.x || 0, y: +g.y || 0, w: +g.w || 0, h: +g.h || 0,
                               r: +g.r || 0, a: Math.max(0, Math.min(1, +g.a || 0)), hv: g.hv ? 1 : 0 });
        if (!glass.ready && state.ready) { glass.ready = true; parent.postMessage({ type: 'glass-ready' }, location.origin); }
        if (REDUCED) renderOnce();
        return;
      }
      if (e.data.type !== 'poster-scroll') return;
      state.scroll = Math.max(0, Math.min(1, +e.data.p || 0)); if (REDUCED) renderOnce();
    });
    return;
  }
  if (Q.has('scroll') || !window.gsap || !window.ScrollTrigger || !window.Lenis) return;
  gsap.registerPlugin(ScrollTrigger);
  const lenis = new Lenis({ lerp: 0.09 });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(time => lenis.raf(time * 1000)); gsap.ticker.lagSmoothing(0);
  ScrollTrigger.create({ trigger: '#spacer', start: 'top top', end: 'bottom bottom',
    onUpdate: st => { state.scroll = st.progress; if (REDUCED) renderOnce(); } });
}

/* ════════════════════════════════════════════════════════════════════════
   14. FALLBACK — no WebGL: stack the light PNGs as plain images
   ════════════════════════════════════════════════════════════════════════ */
async function showFallback(reason) {
  console.warn('[poster-lab] fallback:', reason);
  canvas.style.display = 'none';
  const fb = document.getElementById('fallback'); fb.style.display = 'block';
  try {
    const m = M || await (await fetch(BASE + 'manifest.json')).json();
    for (const L of [...m.layers].sort((a, b) => a.order - b.order)) {
      if (L.kind === 'water_mask' || !L.files?.light) continue;
      const im = document.createElement('img'); im.alt = ''; im.src = BASE + L.files.light;
      if (L.kind === 'reflection') im.style.opacity = '0.5';
      fb.appendChild(im);
    }
  } catch (e) {}
}

/* ════════════════════════════════════════════════════════════════════════
   15. BOOT
   ════════════════════════════════════════════════════════════════════════ */
(async function boot() {
  resize();
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // shaders already work in display values
    renderer.setClearColor(0x0A1430, 1);
  } catch (e) { return showFallback('WebGL unavailable'); }
  resize();
  addEventListener('resize', () => { resize(); renderOnce(); });
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); loopStop(); showFallback('context lost'); });
  try { await build(); }
  catch (e) { console.error('[poster-lab] build failed', e); return showFallback('layers failed to load'); }
  resize();   // sizes the reflection RT now that it exists
  if (state.errors.length) console.warn('[poster-lab]', state.errors.join(', '));
  state.ready = true;
  setupScroll();
  fetchWeather().then(renderOnce);
  setInterval(fetchWeather, 10 * 60 * 1000);
  loopStart();
  setTimeout(streamVariants, 700);   // other times of day arrive after first paint
})();
</script>
