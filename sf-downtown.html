<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Downtown Lab</title>
<meta name="robots" content="noindex">
<!--
  SF Downtown · prototype (12 Nov, owner: "this is happening in downtown San Francisco" — no Golden Gate).
  An isometric toy diorama of downtown SF in the low-poly,
  flat-colour style the owner pointed at (pins with cards, chimney smoke, pigeons, people, cars).
  Everything is modelled in code (Three.js r160, vendored), no downloaded assets.
  A 3×3 downtown grid: Market Street (F-line streetcars, palms) down to the Ferry Building on the
  Embarcadero; Salesforce Tower, the Transamerica Pyramid + redwoods, Embarcadero Center, a dark
  granite tower; Union Square (column, palms, pigeons, Bhanu on a bench); Chinatown + the Dragon
  Gate; the Verified Call tower and plaza; a California St cable car; ferries in the bay. Lighting follows SF's real sun (?hour=17.5 to force a time).
  Drag to pan · wheel / +/- to zoom · click a pin or a postcard to open its card.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1F1B24;--paper:#FFFCF8;--muted:#6E6774;--pin:#D9483B;--font:'Montserrat',sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#6E9FA3;font-family:var(--font);color:var(--ink);overflow-x:hidden}
  #tour{height:900vh}                                  /* scroll length of the camera tour */
  /* embedded in the homepage: the host owns nav, scroll and the page; the city keeps its glimpse + pop-up */
  html.embed .bar, html.embed .hint, html.embed #tour, html.embed .status{display:none}
  html.embed, html.embed body{overflow:hidden;height:100%}
  .hint{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:5;font:600 13px var(--font);color:#fff;letter-spacing:.02em;
        background:rgba(31,27,36,.35);padding:8px 14px;border-radius:999px;transition:opacity .5s;pointer-events:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .pill{position:fixed;z-index:5;background:var(--paper);border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 30px -12px rgba(20,30,40,.35)}
  /* name + nav share one bar on the left (owner, 12 Nov) */
  .bar{left:20px;top:20px;display:flex;align-items:center;gap:6px;padding:7px 10px 7px 7px}
  .brand{display:flex;align-items:center;gap:12px;padding:2px 14px 2px 2px;margin-right:4px;border-right:1px solid #ECE5DB;font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
  .brand canvas{width:40px;height:40px;border-radius:11px;background:#E6F28D;image-rendering:pixelated;image-rendering:crisp-edges}
  .nav{display:flex;gap:2px}
  .nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:4px 12px;border-radius:10px}
  .nav a:hover{background:#F1ECE4}
  .status{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;font-family:var(--mono);font-size:12px;
          letter-spacing:.06em;color:#fff;opacity:.85;white-space:nowrap}
  /* labels that follow 3D anchors */
  .tag{position:fixed;left:0;top:0;z-index:4;pointer-events:auto;cursor:pointer;transform:translate(-50%,-100%);
       background:var(--paper);border-radius:12px;padding:8px 14px 9px;white-space:nowrap;
       box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 24px -10px rgba(20,30,40,.4);transition:opacity .25s}
  .tag small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
  .tag b{font-size:15px}
  /* place labels (they open a small postcard card) */
  .tag.post{padding:6px 11px 7px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,252,248,.92)}
  .tag.post::after{content:'';position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:1px}
  .tag.hide{opacity:0;pointer-events:none}
  /* card */
  .card{position:fixed;z-index:6;right:clamp(16px,6vw,110px);top:50%;width:min(390px,calc(100vw - 32px));transform:translate(0,calc(-50% + 16px));
        opacity:0;pointer-events:none;background:var(--paper);border-radius:22px;padding:24px 24px 20px;
        box-shadow:0 2px 0 rgba(0,0,0,.08),0 30px 60px -20px rgba(20,30,40,.45);transition:opacity .35s,transform .35s cubic-bezier(.2,.7,.2,1)}
  .card.on{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
  .card .eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
  .card h2{font-size:27px;font-weight:700;letter-spacing:-.01em;margin:6px 0 10px}
  .card p{font-size:15px;line-height:1.55;color:#3D3843}
  .card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px;padding-top:14px;border-top:1px solid #ECE5DB}
  .card .stats b{display:block;font-size:19px}
  .card .stats small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
  .card .row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid #ECE5DB;font-size:14px;font-weight:600}
  .card .row a{color:var(--ink)}
  .card .x{position:absolute;right:-12px;top:-12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--paper);font-size:20px;cursor:pointer;
           box-shadow:0 2px 0 rgba(0,0,0,.08),0 8px 18px -8px rgba(20,30,40,.4)}
  .card .stamp{float:right;margin:0 0 6px 12px;width:66px;height:80px;border:2px solid #3F7C83;border-radius:8px;color:#3F7C83;
               font:700 10px/1.2 var(--mono);display:grid;place-items:center;text-align:center;transform:rotate(4deg);padding:6px}
  /* case study overlay (owner, 12 Nov): one clean pop-up over the world, led by metrics + visuals */
  .cs-back{position:fixed;inset:0;z-index:8;background:rgba(24,30,38,.28);-webkit-backdrop-filter:blur(6px) saturate(1.1);backdrop-filter:blur(6px) saturate(1.1);
           opacity:0;pointer-events:none;transition:opacity .35s}
  .cs-back.on{opacity:1;pointer-events:auto}
  .cs{position:fixed;z-index:9;left:50%;top:50%;width:min(1080px,calc(100vw - 32px));max-height:min(88vh,920px);overflow:auto;overscroll-behavior:contain;
      transform:translate(-50%,calc(-50% + 24px)) scale(.985);opacity:0;pointer-events:none;background:var(--paper);border-radius:28px;
      padding:22px clamp(20px,3.4vw,44px) 34px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 40px 90px -30px rgba(20,30,40,.55);
      transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin}
  .cs.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  .cs-top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-22px;margin:-22px calc(-1 * clamp(20px,3.4vw,44px)) 0;
          padding:18px clamp(20px,3.4vw,44px) 14px;background:linear-gradient(var(--paper) 78%,rgba(255,252,248,0));z-index:2}
  .pager{display:flex;align-items:center;gap:4px;background:#F2EDE5;border-radius:14px;padding:4px}
  .pager button{border:0;background:none;font:600 14px var(--font);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
  .pager button:hover{background:#E7E0D5}
  .pager span{font-size:13px;color:var(--muted);padding:0 6px;min-width:46px;text-align:center}
  .cs-x{width:42px;height:42px;border:0;border-radius:12px;background:#F2EDE5;font-size:20px;cursor:pointer;color:var(--ink)}
  .cs-x:hover{background:#E7E0D5}
  .cs h2{font-size:clamp(34px,4.4vw,54px);font-weight:700;letter-spacing:-.025em;margin:18px 0 6px}
  .cs .meta{font-size:15px;color:var(--muted);font-weight:500}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,20px);margin:26px 0 30px}
  .tile .vis{aspect-ratio:4/4.4;border-radius:20px;background:var(--tint,#EFE8DD);overflow:hidden;display:grid;place-items:center;position:relative}
  .tile .vis img,.tile .vis video{width:100%;height:100%;object-fit:var(--fit,cover);display:block}
  .tile .vis.pad img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(30,30,40,.18))}
  .tile .num{display:block;font-size:clamp(24px,2.4vw,32px);font-weight:700;letter-spacing:-.02em;margin-top:14px;line-height:1.05}
  .tile .lab{display:block;font-size:14.5px;line-height:1.4;color:#4A4450;margin-top:6px;max-width:30ch}
  .tile .ft{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .cs .story{font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:#2E2933;max-width:62ch}
  .cs .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .cs .cta a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;padding:13px 20px;border-radius:14px}
  .cs .cta a.pri{background:var(--ink);color:#fff}
  .cs .cta a.sec{background:#F2EDE5;color:var(--ink)}
  .cs .status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 12px;border-radius:999px;background:#EAF3D4;color:#2F4A1E;font-size:13px;font-weight:600}
  .cs .status i{width:8px;height:8px;border-radius:50%;background:#16845E;box-shadow:0 0 0 4px rgba(22,132,94,.18)}
  .cs .facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:-8px 0 30px;font-size:14px;color:#4A4450}
  .cs .facts b{color:var(--ink)}
  .cs-sec{margin-top:54px;padding-top:28px;border-top:1px solid #ECE5DB}
  .cs-sec .k{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .cs-sec h3{font-size:clamp(24px,2.6vw,32px);font-weight:700;letter-spacing:-.015em;margin:8px 0 12px;max-width:26ch}
  .cs-sec h4{font-size:17px;font-weight:700;margin:26px 0 4px}
  .cs-sec p{font-size:16px;line-height:1.6;color:#3D3843;max-width:64ch}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  .cards3>div{background:#F4EFE7;border-radius:18px;padding:18px}
  .cards3 b{display:block;font-size:16px;margin-bottom:6px}
  .cards3 span{font-size:14.5px;line-height:1.5;color:#4A4450}
  .shots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  .shots.three{grid-template-columns:repeat(3,1fr)}
  .shots figure{margin:0}
  .shots .im{border-radius:14px;overflow:hidden;background:#EFE9DF;aspect-ratio:4/3;display:grid;place-items:center}
  .shots img{width:100%;height:100%;object-fit:cover;display:block}
  .shots.contain img{object-fit:contain;padding:8px}
  .shots figcaption{font-size:13px;line-height:1.4;color:#4A4450;margin-top:8px}
  .shots figcaption b{color:var(--ink);display:block}
  .decs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .decs>div{border:1px solid #ECE5DB;border-radius:18px;padding:18px 18px 16px}
  .decs .n{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#16845E}
  .decs b{display:block;font-size:18px;margin:6px 0 10px;letter-spacing:-.01em}
  .decs p{font-size:14.5px;margin:6px 0 0}
  .decs p em{font-style:normal;font-weight:700;color:var(--ink)}
  /* the glimpse: appears beside the Verified Call tower when the tour arrives */
  /* ── the glimpse (owner, 12 Nov): animated, employer facts first, a stack band, tinted by SF's time of day ── */
  .glimpse{position:fixed;left:0;top:0;z-index:6;width:min(372px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:hidden;
           border-radius:22px;padding:14px 16px 16px;color:var(--g-ink);opacity:0;pointer-events:none;
           --g-ink:#1F1B24;--g-sub:#4A4450;--g-mute:#6E6774;--g-line:rgba(31,27,36,.1);--g-chip:rgba(255,255,255,.55);--g-btn:#1F1B24;--g-btn-ink:#fff;
           background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.06),0 24px 50px -18px rgba(20,30,40,.5);transition:opacity .45s}
  .glimpse.on{opacity:1;pointer-events:auto}
  html.lens-on .glimpse{background:transparent;box-shadow:none}         /* the WebGL lens draws the glass */
  html.tod-night .glimpse{--g-ink:#F6F3EE;--g-sub:#D9D4DE;--g-mute:#B8B2C0;--g-line:rgba(255,255,255,.14);--g-chip:rgba(255,255,255,.1);--g-btn:#F6F3EE;--g-btn-ink:#1F1B24}
  .glimpse > *{opacity:0;transform:translateY(10px);filter:blur(6px);transition:opacity .5s, transform .6s cubic-bezier(.2,.8,.2,1), filter .5s;transition-delay:calc(var(--i,0) * 55ms)}
  .glimpse.on > *{opacity:1;transform:none;filter:none}
  .g-top{display:flex;justify-content:space-between;align-items:center;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--g-mute);margin-bottom:10px}
  .g-time{display:inline-flex;align-items:center;gap:6px}
  .g-time i{width:7px;height:7px;border-radius:50%;background:#F2B23C;box-shadow:0 0 0 3px rgba(242,178,60,.25)}
  html.tod-night .g-time i{background:#A9B8E0;box-shadow:0 0 0 3px rgba(169,184,224,.25)}
  .g-vis{position:relative;height:150px;border-radius:14px;overflow:hidden;margin-bottom:12px;background:var(--g-chip)}
  .g-vis img.wide{width:100%;height:100%;object-fit:cover;object-position:50% 38%;animation:gKen 14s ease-in-out infinite alternate}
  .g-vis.phone{display:grid;place-items:center;background:linear-gradient(160deg,#EAF3E2,#D6E8CC)}
  .g-vis.phone img{height:136px;width:auto;border-radius:16px;border:3px solid #1F1B24;animation:gFloat 4.5s ease-in-out infinite}
  .g-vis::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);
                transform:translateX(-120%);animation:gSheen 5.5s ease-in-out infinite 1.2s;pointer-events:none}
  @keyframes gKen{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.14) translate(-3%,2%)}}
  @keyframes gFloat{50%{transform:translateY(-5px) rotate(-1.5deg)}}
  @keyframes gSheen{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
  .g-eb{font-size:12px;font-weight:600;color:var(--g-mute)}
  .g-title{font-size:24px;font-weight:700;letter-spacing:-.015em;margin:2px 0 4px}
  .g-line{font-size:13.5px;line-height:1.45;color:var(--g-sub)}
  .g-facts{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--g-line);font-size:12.5px}
  .g-facts dt{color:var(--g-mute);font-weight:500}
  .g-facts dd{margin:0;color:var(--g-ink);font-weight:600}
  .g-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
  .g-metrics div{background:var(--g-chip);border-radius:12px;padding:8px 9px}
  .g-metrics b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .g-metrics span{display:block;font-size:11px;line-height:1.3;color:var(--g-sub);margin-top:2px}
  .g-status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--g-ink);margin:10px 0 0}
  .g-status i{width:7px;height:7px;border-radius:50%;background:#16845E;animation:gPulse 2s ease-in-out infinite}
  @keyframes gPulse{50%{box-shadow:0 0 0 5px rgba(22,132,94,.22)}}
  .g-tech{margin:10px -16px 12px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .g-track{display:flex;gap:6px;width:max-content;animation:gMarq 22s linear infinite}
  .g-track span{font:500 11.5px var(--mono);letter-spacing:.02em;padding:5px 9px;border-radius:999px;background:var(--g-chip);border:1px solid var(--g-line);white-space:nowrap;color:var(--g-ink)}
  @keyframes gMarq{to{transform:translateX(-50%)}}
  .glimpse button{width:100%;border:0;border-radius:12px;background:var(--g-btn);color:var(--g-btn-ink);font:600 14.5px var(--font);padding:11px 14px;cursor:pointer;transition:transform .2s}
  .glimpse button:hover{transform:translateY(-1px)}
  @media (prefers-reduced-motion:reduce){ .glimpse *, .glimpse > *{animation:none!important;transition:none!important;filter:none!important} }
  @media (max-width:767px){
    .tiles{grid-template-columns:1fr 1fr}
    .tiles .tile:nth-child(3){grid-column:1 / -1}
    .tiles .tile:nth-child(3) .vis{aspect-ratio:16/9}
    .cards3,.decs{grid-template-columns:1fr}
    .shots,.shots.three{grid-template-columns:1fr 1fr}
    .glimpse{left:16px!important;top:auto!important;bottom:16px;transform:none!important}
    .cs{max-height:92vh;border-radius:22px}
  }
  @media (max-width:767px){
    .nav{display:none}
    .card{top:auto;bottom:86px;right:16px;left:16px;width:auto;transform:translate(0,16px)}
    .card.on{transform:none}
  }
</style>

<body>
<canvas id="gl" aria-label="Isometric toy model of downtown San Francisco: Market Street, the Ferry Building, Salesforce Tower, the Transamerica Pyramid, Union Square, Chinatown and the Verified Call tower"></canvas>

<div class="pill bar"><a class="brand" href="./" aria-label="Bhanu Kowshik, home"><canvas id="avatar" width="16" height="16" aria-hidden="true"></canvas>Bhanu Kowshik</a>
  <nav class="nav"><a href="./#about">About me</a><a href="./#work">Work</a><a href="./Bhanu-Kowshik-AI-Native-Designer.pdf" target="_blank" rel="noopener">Résumé</a><a href="./#contact">Contact</a></nav></div>
<div id="tour" aria-hidden="true"></div>
<div id="glimpses"></div>
<div class="hint" id="hint">Scroll to explore San Francisco</div>
<div class="status" id="status"></div>

<div class="cs-back" id="csBack"></div>
<section class="cs" id="cs" role="dialog" aria-modal="true" aria-labelledby="csTitle">
  <div class="cs-top">
    <div class="pager"><button id="csPrev">Previous</button><span id="csIdx">1 of 3</span><button id="csNext">Next</button></div>
    <button class="cs-x" id="csX" aria-label="Close">×</button>
  </div>
  <div id="csBody"></div>
</section>
<aside class="card" id="card" aria-live="polite">
  <button class="x" id="cardX" aria-label="Close">×</button>
  <div id="cardBody"></div>
</aside>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const Q = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RAFSHIM = Q.has('rafshim');

/* ══════════════ renderer, camera, scene ══════════════ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const WATER = new THREE.Color('#6E9FA3');
scene.background = WATER.clone();

const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 500);
const view = { tx: 4, tz: -2, zoom: 0.52, az: Math.PI / 4, el: 0.62 };   // az 45° · elevation ~35°
const HOME = { tx: 4, tz: -2, zoom: 0.52 };
function placeCamera() {
  const W = innerWidth || 1200, H = innerHeight || 800;
  const span = 62 / view.zoom * (W < H ? 1.25 : 1);                 // world units across the shorter side
  const a = W / H;
  cam.left = -span * a / 2; cam.right = span * a / 2; cam.top = span / 2; cam.bottom = -span / 2;
  if (a < 1) { cam.left = -span / 2; cam.right = span / 2; cam.top = span / a / 2; cam.bottom = -span / a / 2; }
  const d = 120;
  cam.position.set(view.tx + Math.cos(view.el) * Math.cos(view.az) * d, Math.sin(view.el) * d,
                   view.tz + Math.cos(view.el) * Math.sin(view.az) * d);
  cam.lookAt(view.tx, 0, view.tz);
  cam.updateProjectionMatrix();
  try { const e = Math.min(240, span * 0.95);                        // sun is declared later (TDZ on first call)
    Object.assign(sun.shadow.camera, { left: -e, right: e, top: e, bottom: -e }); sun.shadow.camera.updateProjectionMatrix(); } catch (e) {}
}
function resize() {
  renderer.setSize(innerWidth || 1200, innerHeight || 800, false);
  placeCamera();
}
addEventListener('resize', resize);

/* ══════════════ materials + little builders ══════════════ */
const matCache = {};
const M = (hex, o = {}) => {
  const k = hex + JSON.stringify(o);
